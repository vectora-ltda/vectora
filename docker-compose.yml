name: vectora

# Stack de infraestrutura do Vectora — PostgreSQL + Redis + Qdrant.
#
# O Vectora em si NÃO roda como container: instale o binário no host
# (scons release gera o instalador; no Linux use o .deb ou .AppImage).
# Os serviços abaixo ficam acessíveis em 127.0.0.1 nas portas padrão.
#
# Uso (dev local + desktop):
#   scons docker          → inicia os 3 serviços abaixo
#   vectora start         → inicia o backend no host (lê ~/.vectora/.env)
#
# As credenciais default (usuário/senha/API key = "vectora") são as MESMAS de
# backend/defaults.env, então `docker compose up` + Vectora conectam sem ajuste.
# Configure ~/.vectora/.env (ou deixe os defaults embarcados cuidarem):
#   STORAGE_MODE=complete
#   POSTGRES_DSN=postgresql+asyncpg://vectora:vectora@127.0.0.1:5432/vectora
#   REDIS_URL=redis://:vectora@127.0.0.1:6379/0
#   QDRANT_URL=http://127.0.0.1:6333
#   QDRANT_API_KEY=vectora
#
# Uso em VPS/servidor:
#   1. Instale o Vectora: dpkg -i vectora.deb  (ou AppImage, ou rpm)
#   2. Configure ~/.vectora/.env com os DSNs acima
#   3. docker compose up -d    → sobe infra
#   4. vectora start --headless → sobe o backend (systemd, supervisor, etc.)

services:
  postgres:
    # pgvector/pgvector:pg16: necessário para CREATE EXTENSION vector
    # (o postgres:16-alpine vanilla não traz pgvector — startup falharia).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vectora}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vectora}
      - POSTGRES_DB=${POSTGRES_DB:-vectora}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-vectora-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vectora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # redis-stack-server inclui RediSearch + RedisJSON — módulos usados pelo
    # cache LLM distribuído (RedisCache/RedisSemanticCache via FT.*/JSON.GET).
    # O cache LLM detecta automaticamente a ausência dos módulos e cai para
    # InMemoryCache; o stack server é mantido para quando o cache for ativado.
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:-vectora}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD:-vectora} ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      # Auth-first: API key exigida, igual ao defaults.env (QDRANT_API_KEY).
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-vectora}
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  qdrant-data:
    driver: local
