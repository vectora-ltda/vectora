# vectora.toml — Configuração do workspace Vectora. Seguro para commitar.
# Edite as seções abaixo para personalizar este workspace.

[workspace]
name = "vectora"
# description = ""

# [storage]
# mode = "complete"                          # "lite" | "complete" — sobrescreve o padrão global
# postgres_dsn = "${MEUPROJETO_POSTGRES_DSN}" # nunca credenciais literais
# qdrant_url = "http://localhost:6333"
# qdrant_collection = "meuprojeto_articles"   # isola vetores por workspace
# redis_url = "${MEUPROJETO_REDIS_URL}"

# [rag]
# embedding_model = "embed-multilingual-v3.0"
# chunk_size = 1000
# chunk_overlap = 200

# [agent]
# allowed_models = ["claude-sonnet-4-6"]
# default_model = "claude-sonnet-4-6"

[global]
mode = "desktop" # ou "cli", "headless", "mcp", "web"

[runtime]
auto_update = true

[server]
host = "0.0.0.0"
port = 3000 # Exemplo de porta para API local

# Sandbox — isola terminal, PTY interativo e tools de arquivo do agente
# dentro de um worker jailado (bwrap no Linux). Desabilitado por padrão
# (opt-in); sem esta seção, comportamento atual (sem sandbox) é preservado.
[sandbox]
enabled = false          # true liga o worker jailado pra este workspace
backend = "local"        # "local" (bwrap/Landlock, Linux) | "macos" (sandbox-exec/Seatbelt) | "singularity" (Apptainer, HPC/cluster sem daemon Docker) | "docker" | "ssh" | "modal"
rw_paths = []             # paths extras montados read-write além do workspace
ro_paths = []             # paths extras montados read-only (ex. libs compartilhadas)
mask = [                  # paths sempre ocultos (tmpfs vazio), mesmo se dentro do workspace
  ".env",
  "**/*.pem",
  "**/.ssh/**",
  "**/.aws/**",
]
no_gpu = true             # nega acesso a dispositivos de GPU
lockdown = false          # true nega rede por completo (--unshare-net)
# docker_image = "python:3.13-slim"  # só usado quando backend = "docker"
# remote_host = "vps.example.com"    # só usado quando backend = "ssh"
# ssh_key_id = "minha-chave"         # só usado quando backend = "ssh"
