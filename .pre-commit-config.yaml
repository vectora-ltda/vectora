default_language_version:
  python: python3

default_stages: [pre-commit]
minimum_pre_commit_version: 3.0.0

exclude: |
  (?x)^(
    \.git/.*|
    .*\.pdf$|
    .*\.lock$|
    package-lock\.json|
    .*pnpm-lock\.yaml|
    yarn\.lock|
    coverage\..*|
    \.env.*|
    \.venv/.*|
    graphify.*|
    vectora/backend/services/context_graph/.*|
    docs/_vendor/.*|
    # `\.mjs.*` (sem `.*` no início) só batia com caminho começando
    # literalmente em ".mjs" — nunca excluía nada de verdade. O prettier
    # vinha reformatando vectora/frontend/public/pdf.worker.min.mjs (vendor
    # minificado, licença do PDF.js) toda vez que alguém rodava o hook com
    # uma versão/config diferente de prettier — regex corrigida pra bater
    # em qualquer .mjs, casado com a intenção original (excluir tudo).
    .*\.mjs$|
    ^chrome-devtools-mcp-main/.*|
    ^hermes-agent/.*|
    ^paperclip-master/.*|
    ^omskills-main/.*|
    ^ragflow-main/.*|
    ^graphify-8/.*|
    ^\.claude/worktrees/.*|
    (^|/)node_modules/.*|
    (^|/)\.venv/.*|
    (^|/)dist/.*|
    (^|/)build/.*|
    (^|/)coverage/.*|
    (^|/)\.pytest_cache/.*|
    (^|/)__pycache__/.*|
    # Gerado por `wrangler types` — reformatar aqui é churn inútil, o
    # arquivo é sobrescrito no próximo `wrangler types`.
    services/worker-configuration\.d\.ts
  )$

repos:
  # ==========================================
  # UV Lock Validation
  # ==========================================
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.27
    hooks:
      - id: uv-lock

  # ==========================================
  # Basic File Validation
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        name: Fix End of File
        stages: [pre-commit]
      - id: check-yaml
        name: Validate YAML
        args: ["--allow-multiple-documents", "--unsafe"]
        stages: [pre-commit]
      - id: check-json
        name: Validate JSON
        stages: [pre-commit]
      - id: check-toml
        name: Validate TOML
        stages: [pre-commit]
      - id: check-merge-conflict
        name: Check for Merge Conflicts
        stages: [pre-commit]
      - id: check-added-large-files
        name: Check for Large Files
        args: ["--maxkb=5000"]
        stages: [pre-commit]
      - id: detect-private-key
        name: Detect Private Keys
        stages: [pre-commit]

  # ==========================================
  # Python Syntax Check (stdlib compileall)
  # Roda antes do ruff — rejeita SyntaxErrors imediatamente.
  # ==========================================
  - repo: local
    hooks:
      - id: compileall
        name: Python Syntax (compileall)
        entry: uv run python -m compileall -q -j0
        language: system
        types: [python]

  # ==========================================
  # Sem proveniência de processo em código
  # ==========================================
  - repo: local
    hooks:
      - id: removed-path-references
        name: Check references to removed or renamed paths
        entry: uv run python utils/check_removed_path_references.py
        language: system
        always_run: true
        pass_filenames: false
      - id: no-plan-comments
        name: Sem Sprint/Bloco/Fase ou menção a ferramenta de IA em código
        entry: uv run python utils/check_no_plan_comments.py --changed
        language: system
        files: \.(py|ts|tsx|js|jsx)$
        exclude: ^utils/(check_no_plan_comments|test_check_no_plan_comments|check_no_plan_pr_metadata|test_check_no_plan_pr_metadata)\.py$

  # ==========================================
  # Python Validation
  # ==========================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        name: Ruff Lint (Python)
        args: [--fix, --select, I]
        files: \.py$
      - id: ruff-format
        name: Ruff Format (Python)
        files: \.py$

  # ==========================================
  # TypeScript / JavaScript Validation
  # ==========================================
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: prettier --write
        # `language: system` resolvia o "prettier" do PATH de quem disparava o
        # commit — terminal (nvm4w, 3.8.3), GitHub Desktop (git embutido, PATH
        # próprio) e company/package.json (^3.9.5) todos resolviam binários
        # DIFERENTES, cada um formatando um pouco diferente (ex.: quebra de
        # linha em declaração CSS na borda do printWidth) → o hook reformatava
        # de novo a cada commit dependendo de qual cliente disparou, ping-pong
        # infinito. `language: node` + versão fixa = pre-commit cria um
        # ambiente isolado com ESSE prettier exato, igual pra qualquer cliente
        # git (terminal, GitHub Desktop, VS Code, CI).
        language: node
        additional_dependencies: ["prettier@3.9.5"]
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|md|yaml|yml|css)$
        types_or: [text]

  # ==========================================
  # ==========================================
  # Security & Vulnerability Scans
  # ==========================================
  - repo: local
    hooks:
      - id: bandit
        name: Bandit Security Scan
        # Invoca via `python -m bandit` (spawna python.exe) em vez do launcher
        # `bandit.exe`: o stub de console-script gerado pelo pip/uv não é
        # assinado e o Smart App Control / WDAC do Windows o bloqueia ao spawn
        # (os error 4551). `python -m` importa o mesmo módulo sem o stub.
        # --exclude aqui espelha o mesmo skip do `scons lint` (SConstruct) —
        # backend/context_graph é código portado do graphify (MIT) com
        # exceções já documentadas em pyproject.toml per-file-ignores.
        entry: uv run --project vectora python -m bandit -s B110,B101 -c vectora/pyproject.toml --exclude vectora/backend/context_graph
        language: system
        types: [python]

  # ==========================================
  # Type Checking — Python (Astral `ty`, full repo)
  # ==========================================
  # Substitui o antigo Pyright limitado a 2 pastas. `ty` é um type checker
  # em Rust ~10x mais rápido que pyright/mypy e cobre tudo de uma vez.
  - repo: local
    hooks:
      - id: ty
        name: Type Check — Python (ty)
        # --directory vectora seta o CWD para vectora/ (como o scons lint faz),
        # sem precisar de bash — funciona em Windows, Linux e macOS.
        entry: uv run --directory vectora ty check backend tests
        language: system
        types: [python]
        pass_filenames: false

  # ==========================================
  # JS/TS Lint — oxlint (Rust, OXC toolchain)
  # ==========================================
  # ~50–100x mais rapido que ESLint; config em chat/.oxlintrc.json.
  - repo: local
    hooks:
      - id: oxlint
        name: JS/TS Lint (oxlint)
        entry: pnpm --dir vectora/frontend exec oxlint
        language: system
        files: ^vectora/frontend/.*\.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false

      - id: i18n
        name: Frontend i18n lint
        entry: pnpm --dir vectora/frontend run lint:i18n -- --changed
        language: system
        files: ^vectora/frontend/.*\.(ts|tsx)$

  # ==========================================
  # Type Checking — TypeScript (tsc)
  # ==========================================
  # `pnpm --dir chat exec tsc` é cross-platform (Windows/Linux/macOS) e
  # não depende de `bash` — sem dependência de WSL no Windows.
  - repo: local
    hooks:
      - id: tsc
        name: Type Check — TypeScript (tsc)
        # `typecheck` gera o routeTree.gen.ts (TanStack Router, gitignored) antes
        # do tsc --noEmit; tsc puro falharia sem o route tree.
        entry: pnpm --dir vectora/frontend run typecheck
        language: system
        files: ^vectora/frontend/.*\.(ts|tsx)$
        pass_filenames: false

  # ==========================================
  # Type Checking — TypeScript (services, Cloudflare Worker)
  # ==========================================
  - repo: local
    hooks:
      - id: tsc-services
        name: Type Check — TypeScript (services)
        entry: pnpm --dir services exec tsc --noEmit
        language: system
        files: ^services/.*\.ts$
        pass_filenames: false

  # ==========================================
  # GitHub Actions Workflow Lint (actionlint)
  # ==========================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        files: ^\.github/workflows/.*\.ya?ml$

ci:
  autofix_commit_msg: "chore: auto fixes from pre-commit hooks"
  autofix_prs: false
  autoupdate_branch: ""
  skip: []
  submodules: false
