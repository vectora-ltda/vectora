language: pt-BR

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_instructions:
    - path: "**"
      instructions: |
        Revise o comportamento entregue e a sua evidência. Testes são parte do
        contrato da mudança: para cada comportamento novo ou corrigido, procure
        pelo menos um teste de caminho feliz, um teste negativo ou de erro e um
        teste de regressão que falhe sem a correção. Se a mudança for
        concorrente, persistente, distribuída ou orientada a eventos, exija
        também testes de repetição, reexecução, conflito, cancelamento,
        recuperação após falha e idempotência quando aplicável. Não considere
        um teste superficial que apenas executa o código como cobertura
        suficiente; verifique asserções sobre estado, efeitos e contratos.

        Confira se o PR mantém os contratos canônicos entre backend, frontend,
        Electron, providers, storage e wire format. Aponte drift de schema,
        mudanças incompatíveis, campos opcionais tratados como obrigatórios,
        migrações incompletas e diferenças entre SQLite e PostgreSQL/Qdrant/
        Redis. Em mudanças de API, exija atualização de schemas, clientes,
        fixtures e testes de compatibilidade.

        Verifique limites e falhas: entradas vazias ou inválidas, timeouts,
        cancelamento, retry, duplicação, paginação, limites de tamanho,
        recursos indisponíveis e respostas parciais. Confirme que erros não
        vazam segredos nem deixam estado parcialmente persistido.

        Faça revisão de segurança em SSRF, DNS rebinding, traversal, prompt
        injection, egress, autenticação/autorização, isolamento por workspace,
        credenciais, logs e conteúdo não confiável. Não aceite segurança apenas
        por validação no chamador quando o adapter ou provider também precisa
        aplicar a política.

        Para estados e máquinas de execução, confira transições válidas,
        terminais imutáveis, CAS/versões, ownership, leases, retomada,
        idempotência e auditoria. Para eventos e streams, confira ordem,
        cursores, replay, reconexão, heartbeat, deduplicação e consistência
        entre o ledger e os stores derivados.

        Para mudanças de CI, scripts ou configuração, verifique execução em
        Windows e Linux quando suportado, quoting, códigos de saída, limpeza
        de processos, cache, artefatos e se o gate realmente falha quando a
        prova necessária não está disponível. Não trate uma execução anterior
        ou um resultado informado no PR como evidência do commit atual.

        Seja crítico quanto a escopo: não peça refatorações sem relação, mas
        não aceite marcar uma issue como concluída quando a implementação só
        cobre um adapter, backend, provider ou caminho feliz. Em cada achado,
        indique o arquivo, o cenário que reproduz o problema e a prova/teste
        que deve ser acrescentado ou corrigido.

    - path: "vectora/tests/**"
      instructions: |
        Verifique se os testes têm asserções fortes e isolam efeitos externos.
        Procure testes negativos, de regressão, limites, concorrência,
        cancelamento e recuperação, conforme o comportamento coberto. Rejeite
        testes que apenas verificam status 200, ausência de exceção ou mocks
        sem confirmar os argumentos e os efeitos observáveis.

    - path: ".github/workflows/**"
      instructions: |
        Confira se os gates executam a suíte correta, propagam falhas, usam
        versões suportadas, limpam serviços locais e publicam artefatos úteis.
        Mudanças de workflow devem incluir uma prova negativa quando alteram
        um gate ou uma condição de falha.

chat:
  auto_reply: true
  art: false

knowledge_base:
  code_guidelines:
    enabled: true
