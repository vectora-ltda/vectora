baseURL = 'https://docs.vectora.company/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true
title = 'Vectora Docs'
enableEmoji = false
disableKinds = ["taxonomy", "term"]

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[languages]
  [languages.pt]
    label = "Português"
    locale = "pt-BR"
    weight = 2
    title = "Vectora Docs"
    [languages.pt.params]
      description = "Vectora — workspace de desenvolvimento assistido por IA, com agente, RAG, Context Graph, workbenches e conectores MCP configuráveis."
    [[languages.pt.menu.main]]
      identifier = "vectora.company"
      name = "vectora.company"
      url = "https://vectora.company"
      weight = 2
    [[languages.pt.menu.main]]
      identifier = "signup"
      name = "Começar trial grátis"
      url = "https://vectora.company/signup"
      weight = 3
      [languages.pt.menu.main.params]
        type = "button"
    [[languages.pt.menu.main]]
      identifier = "language-switch"
      weight = 4
      [languages.pt.menu.main.params]
        type = "language-switch"
    [[languages.pt.menu.main]]
      identifier = "search"
      weight = 5
      [languages.pt.menu.main.params]
        type = "search"
    [[languages.pt.menu.main]]
      identifier = "theme-toggle"
      weight = 6
      [languages.pt.menu.main.params]
        type = "theme-toggle"

  [languages.en]
    label = "English"
    locale = "en"
    weight = 1
    title = "Vectora Docs"
    [languages.en.params]
      description = "Vectora — an AI-assisted development workspace with agents, RAG, Context Graph, workbenches, and configurable MCP connectors."
    [[languages.en.menu.main]]
      identifier = "vectora.company"
      name = "vectora.company"
      url = "https://vectora.company"
      weight = 2
    [[languages.en.menu.main]]
      identifier = "signup"
      name = "Start free trial"
      url = "https://vectora.company/signup"
      weight = 3
      [languages.en.menu.main.params]
        type = "button"
    [[languages.en.menu.main]]
      identifier = "language-switch"
      weight = 4
      [languages.en.menu.main.params]
        type = "language-switch"
    [[languages.en.menu.main]]
      identifier = "search"
      weight = 5
      [languages.en.menu.main.params]
        type = "search"
    [[languages.en.menu.main]]
      identifier = "theme-toggle"
      weight = 6
      [languages.en.menu.main.params]
        type = "theme-toggle"

  [languages.es]
    label = "Español"
    locale = "es"
    weight = 3
    title = "Vectora Docs"
    [languages.es.params]
      description = "Vectora — un workspace de desarrollo asistido por IA con agentes, RAG, Context Graph, workbenches y conectores MCP configurables."
    [[languages.es.menu.main]]
      identifier = "vectora.company"
      name = "vectora.company"
      url = "https://vectora.company"
      weight = 2
    [[languages.es.menu.main]]
      identifier = "signup"
      name = "Iniciar prueba gratis"
      url = "https://vectora.company/signup"
      weight = 3
      [languages.es.menu.main.params]
        type = "button"
    [[languages.es.menu.main]]
      identifier = "language-switch"
      weight = 4
      [languages.es.menu.main.params]
        type = "language-switch"
    [[languages.es.menu.main]]
      identifier = "search"
      weight = 5
      [languages.es.menu.main.params]
        type = "search"
    [[languages.es.menu.main]]
      identifier = "theme-toggle"
      weight = 6
      [languages.es.menu.main.params]
        type = "theme-toggle"

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "img/vectora-logo-alt.svg"
      link = "/"

  [params.page]
    width = "normal"
    [params.page.contextMenu]
      enable = true
      display = true

  [params.toc]
    displayToc = true

  [params.footer]
    displayCopyright = true
    displayPoweredBy = true

  [params.theme]
    default = 'dark'
    displayToggle = true

  favicon = "favicon-32x32.png"

  [params.author]
    name = 'Vectora'

  [params.opengraph]
    image = '/img/vectora-logo-alt.svg'
    locale = 'en'

  [params.seo]
    keywords = 'Vectora, self-hosted AI agent, RAG, Context Graph, MCP, deep agent'
    robots = 'index, follow'
