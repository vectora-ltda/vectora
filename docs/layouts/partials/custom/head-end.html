<link rel="preload" href="/fonts/aeonikmono-regular.otf" as="font" type="font/otf" crossorigin />
<style>
  /* Paleta Vectora — mesmos valores de frontend/src/styles.css,
     mapeados nos tokens reais do Hextra (inspecionados em
     assets/css/styles.css do módulo imfing/hextra@v0.12.2):
       - accent: HSL via --primary-hue/-saturation/-lightness
         (#2563eb ~ hsl(221deg 83% 53%), idêntico em claro/escuro no produto)
       - superfícies: --hx-color-white/gray-* (claro) e --hx-color-dark/neutral-* (escuro)
     Hextra alterna claro/escuro via classe .dark em <html> (mesma convenção
     do next-themes usado no frontend, attribute="class"). */
  :root {
    --primary-hue: 221deg;
    --primary-saturation: 83%;
    --primary-lightness: 53%;

    --hx-color-white: #ffffff;
    --hx-color-gray-50: #f6f6f6;
    --hx-color-gray-100: #f0f0f0;
    --hx-color-gray-200: #d8d8d8;
  }

  .dark {
    --primary-hue: 221deg;
    --primary-saturation: 83%;
    --primary-lightness: 53%;

    --hx-color-dark: #1f1f1f;
    --hx-color-neutral-900: #181818;
    --hx-color-neutral-800: #262626;
    --hx-color-neutral-700: #2a2a2a;
  }

  body {
    color: #2b2b2b;
  }
  .dark body {
    color: #d4d4d4;
  }

  main {
    font-family:
      "Aeonik Mono",
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      "Liberation Mono",
      "Courier New",
      monospace;
  }

  @font-face {
    font-family: "Aeonik Mono";
    src: url("/fonts/aeonikmono-regular.otf") format("opentype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Aeonik Mono";
    src: url("/fonts/aeonikmono-medium.otf") format("opentype");
    font-weight: 500;
  }
  @font-face {
    font-family: "Aeonik Mono";
    src: url("/fonts/aeonikmono-semibold.otf") format("opentype");
    font-weight: 600;
  }

  /* Botão de CTA na navbar ("Começar trial grátis") — o Hextra v0.12.2 não
     tem um tipo "button" nativo pra menu.main (só link/search/theme-toggle/
     language-switch), então o item vira um <a> comum sem estilo. Targeteado
     pelo href porque o partial de navbar não expõe o identifier no DOM. */
  a[href="https://vectora.company/signup"] {
    background-color: hsl(var(--primary-hue) var(--primary-saturation) var(--primary-lightness));
    color: #fff !important;
    padding: 0.4rem 0.9rem;
    border-radius: 0.5rem;
    font-weight: 500;
    transition: opacity 0.15s ease;
  }
  a[href="https://vectora.company/signup"]:hover {
    opacity: 0.85;
  }

  /* Link "vectora.company" na navbar — mesmo problema do botão de signup
     acima (sem tipo nativo pra parecer um atalho de verdade), mas em estilo
     secundário (outline) pra não competir com o CTA primário. */
  a[href="https://vectora.company"] {
    border: 1px solid currentColor;
    border-radius: 0.5rem;
    padding: 0.3rem 0.7rem;
    opacity: 0.75;
  }
  a[href="https://vectora.company"]:hover {
    opacity: 1;
  }
</style>
