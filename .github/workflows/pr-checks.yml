name: PR Checks

# Roda em todo PR contra uma linha de desenvolvimento suportada e valida que
# o TÍTULO do PR segue
# Conventional Commits — o título vira o commit de squash-merge, que
# release-please.yml lê pra decidir o bump de versão e a seção do
# CHANGELOG.md. Um título malformado quebra essa automação em silêncio, daí
# o gate aqui, não só cosmético. Mesmo padrão de
# lancedb/.github/workflows/dev.yml.

on:
  pull_request:
    types:
      [
        opened,
        edited,
        synchronize,
        reopened,
        milestoned,
        demilestoned,
        labeled,
        unlabeled,
      ]
    branches: ["**"]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-tests:
    name: Testes das linhas de release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          all-extras: "false"
          working-directory: vectora
      - name: Executa testes das utilidades de release
        run: >-
          uv run --project vectora pytest -q
          utils/test_rotate_release_lines.py
          utils/test_prepare_release_line_config.py
          utils/test_select_release_line.py

  commitlint:
    name: Verify PR title (Conventional Commits)
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm install @commitlint/cli @commitlint/config-conventional
      # body-max-line-length/footer-max-line-length/body-leading-blank
      # desligadas: o GitHub sempre garante linha em branco entre título e
      # corpo, e quebra o corpo em linhas curtas — essas regras dariam falso
      # positivo em qualquer PR com descrição normal.
      - run: >
          echo 'module.exports = {
            extends: ["@commitlint/config-conventional"],
            rules: {
              "body-max-line-length": [0, "always", Infinity],
              "footer-max-line-length": [0, "always", Infinity],
              "body-leading-blank": [0, "always"]
            }
          }' > .commitlintrc.js
      # Sem `--edit`: essa flag espera um COMMIT_EDITMSG de verdade dentro
      # de um repo git ("Could not find git root" sem checkout) — pra
      # validar uma string solta (o título do PR, não um commit real),
      # o jeito certo é ler de stdin sem flag nenhuma.
      - run: npx commitlint --verbose <<< "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const message = `**Título do PR fora do padrão**

              Este repositório segue [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) — o título do PR vira o commit de squash-merge e alimenta o versionamento e o changelog automáticos (release-please).

              Exemplos válidos: \`feat: adiciona X\`, \`fix(frontend): corrige Y\`, \`docs: atualiza Z\`.

              Ajuste o título do PR pra corrigir.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const already = comments.some((c) => c.body === message);
            if (!already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message,
              });
            }
            core.setFailed(message);

  no-plan-metadata:
    name: Sem Sprint/Bloco/Fase ou menção a ferramenta de IA em título/descrição do PR
    # Sem permissão de escrita no PR aqui de propósito: este job lê
    # título e corpo do PR (dado potencialmente hostil, ex. fork). Quem comenta
    # é o job `comment-no-plan-metadata`, que não lê nada do PR.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python utils/check_no_plan_pr_metadata.py
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  comment-no-plan-metadata:
    name: Comenta a reprovação de título/descrição no PR
    needs: no-plan-metadata
    # PR de fork recebe token somente leitura: lá a falha aparece só no check.
    if: failure() && needs.no-plan-metadata.result == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Comenta no PR
        uses: actions/github-script@v8
        with:
          script: |
            const message = `**Título/descrição do PR com proveniência de processo**

              Título e descrição não podem referenciar Sprint/Bloco/Fase nem ferramenta/revisor de IA (CodeRabbit, Claude, Copilot, etc) — mesma regra dos comentários de código (CLAUDE.md §1, que cobre também mensagens de PR).

              Descreva só o que a mudança faz; histórico de planejamento deve ficar em \`.claude/plans/\` ou na issue/discussão apropriada.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (!comments.some((c) => c.body === message)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message,
              });
            }
