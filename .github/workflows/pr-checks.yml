name: PR Checks

# Roda em todo PR contra master: aplica labels automáticas por conventional
# commit/path (.github/labeler.yml) e valida que o TÍTULO do PR segue
# Conventional Commits — o título vira o commit de squash-merge, que
# release-please.yml lê pra decidir o bump de versão e a seção do
# CHANGELOG.md. Um título malformado quebra essa automação em silêncio, daí
# o gate aqui, não só cosmético. Mesmo padrão de
# lancedb/.github/workflows/dev.yml.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [master]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  labeler:
    name: Label PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: srvaroa/labeler@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: Verify PR title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm install @commitlint/cli @commitlint/config-conventional
      # body-max-line-length/footer-max-line-length/body-leading-blank
      # desligadas: o GitHub sempre garante linha em branco entre título e
      # corpo, e quebra o corpo em linhas curtas — essas regras dariam falso
      # positivo em qualquer PR com descrição normal.
      - run: >
          echo 'module.exports = {
            extends: ["@commitlint/config-conventional"],
            rules: {
              "body-max-line-length": [0, "always", Infinity],
              "footer-max-line-length": [0, "always", Infinity],
              "body-leading-blank": [0, "always"]
            }
          }' > .commitlintrc.js
      # Sem `--edit`: essa flag espera um COMMIT_EDITMSG de verdade dentro
      # de um repo git ("Could not find git root" sem checkout) — pra
      # validar uma string solta (o título do PR, não um commit real),
      # o jeito certo é ler de stdin sem flag nenhuma.
      - run: npx commitlint --verbose <<< "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `**Título do PR fora do padrão**

              Este repositório segue [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) — o título do PR vira o commit de squash-merge e alimenta o versionamento e o changelog automáticos (release-please).

              Exemplos válidos: \`feat: adiciona X\`, \`fix(frontend): corrige Y\`, \`docs: atualiza Z\`.

              Ajuste o título do PR pra corrigir.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const already = comments.some((c) => c.body === message);
            if (!already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message,
              });
            }
            core.setFailed(message);

  no-plan-metadata:
    name: Sem Sprint/Bloco/Fase ou menção a ferramenta de IA em título/descrição do PR
    # Sem `permissions: pull-requests: write` aqui de propósito: este job já
    # roda com o título/corpo do PR (dado potencialmente hostil, ex. fork).
    # Comentar no PR exige escrita; quem comenta é o job trusted em
    # pr-checks-comment.yml (workflow_run, contexto do branch base) — nunca
    # o job que processa dado da PR direto.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: check
        run: python utils/check_no_plan_pr_metadata.py
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Registra o número do PR pro job de comentário
        if: failure() && steps.check.conclusion == 'failure'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt
      - name: Upload do número do PR (consumido pelo job trusted)
        if: failure() && steps.check.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: no-plan-metadata-failure
          path: pr-number.txt
          retention-days: 1
