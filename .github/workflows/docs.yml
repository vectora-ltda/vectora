name: Docs

# Valida o build do site de documentação (Hugo) em todo PR que toca docs/ e
# publica em produção (Vercel) a cada push em master. O deploy é pulado, sem
# falhar, quando os secrets da Vercel não estão configurados.

on:
  push:
    branches: [master, "release/**"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.0"

jobs:
  build:
    name: Docs (Hugo build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # Mesma versão pinada em docs/vercel.json: o build de verificação
      # precisa refletir o que a Vercel compila em produção.
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.3"
          extended: true
      - name: Build (verifica que o site compila)
        working-directory: docs
        run: hugo --gc --minify

  deploy:
    name: Deploy produção (Vercel)
    runs-on: ubuntu-24.04
    needs: build
    # workflow_dispatch permite re-tentar a publicação pela aba Actions; o
    # github.ref fica travado em master para um disparo manual de outra
    # branch nunca publicar em produção.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    # Os secrets de produção vivem só no Environment "Production"; sem
    # `environment:` o job os enxerga vazios, sem erro.
    environment: Production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Detect deployment credentials
        id: credentials
        shell: bash
        run: |
          echo "has_vercel_token=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Deploy docs (Vercel)
        if: >-
          steps.credentials.outputs.has_vercel_token == 'true' &&
          env.VERCEL_PROJECT_ID != ''
        working-directory: docs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel --prod --yes --token="$VERCEL_TOKEN"
      - name: Resumo
        if: always()
        env:
          HAS_VERCEL_TOKEN: ${{ steps.credentials.outputs.has_vercel_token }}
        run: |
          echo "## Deploy de produção" >> "$GITHUB_STEP_SUMMARY"
          echo "- docs (Vercel)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_VERCEL_TOKEN" != "true" ]; then
            echo "VERCEL_TOKEN ausente: deploy pulado." >> "$GITHUB_STEP_SUMMARY"
          fi
