name: Rotate release lines

# Um release publicado de desenvolvimento avança as duas linhas ativas. O
# workflow é separado do Release Please para que a PR de release continue
# sendo o único ponto de aprovação da alteração de configuração versionada.
on:
  release:
    types: [published]

concurrency:
  group: release-line-rotation-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  rotate:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          persist-credentials: false

      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          all-extras: "false"
          working-directory: vectora

      - name: Calculate release-line rotation
        id: rotation
        shell: bash
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          uv run --project vectora python utils/rotate_release_lines.py "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

      - name: Skip releases outside the active development line
        if: steps.rotation.outputs.rotate != 'true'
        run: echo "O release publicado não corresponde à linha configurada de desenvolvimento; nenhuma rotação será feita."

      - name: Create the next maintenance branch and milestones
        if: steps.rotation.outputs.rotate == 'true'
        uses: actions/github-script@v8
        env:
          MAINTENANCE_BRANCH: ${{ steps.rotation.outputs.maintenance_branch }}
          MAINTENANCE_MILESTONE: ${{ steps.rotation.outputs.maintenance_milestone }}
          DEVELOPMENT_MILESTONE: ${{ steps.rotation.outputs.development_milestone }}
          DEVELOPMENT_BRANCH: ${{ steps.rotation.outputs.development_branch }}
          RELEASE_VERSION: ${{ steps.rotation.outputs.release_version }}
          PREVIOUS_MAINTENANCE_BRANCH: ${{ steps.rotation.outputs.previous_maintenance_branch }}
          PREVIOUS_MAINTENANCE_MILESTONE: ${{ steps.rotation.outputs.previous_maintenance_milestone }}
          PREVIOUS_DEVELOPMENT_MILESTONE: ${{ steps.rotation.outputs.previous_development_milestone }}
          RELEASE_TAG: ${{ steps.rotation.outputs.release_tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {
              MAINTENANCE_BRANCH,
              MAINTENANCE_MILESTONE,
              DEVELOPMENT_MILESTONE,
              PREVIOUS_MAINTENANCE_BRANCH,
              PREVIOUS_MAINTENANCE_MILESTONE,
              PREVIOUS_DEVELOPMENT_MILESTONE,
              RELEASE_TAG,
            } = process.env;
            const { owner, repo } = context.repo;

            let tagRef;
            try {
              tagRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${RELEASE_TAG}`,
              });
            } catch (error) {
              core.setFailed(`Não foi possível resolver a tag publicada ${RELEASE_TAG}: ${error.message}`);
              return;
            }
            let releaseSha = tagRef.data.object.sha;
            if (tagRef.data.object.type === "tag") {
              const annotated = await github.rest.git.getTag({
                owner,
                repo,
                tag_sha: releaseSha,
              });
              releaseSha = annotated.data.object.sha;
            }

            const developmentRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${process.env.DEVELOPMENT_BRANCH}`,
            });
            const ancestry = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: releaseSha,
              head: developmentRef.data.object.sha,
            });
            if (!["ahead", "identical"].includes(ancestry.data.status)) {
              core.setFailed(
                `A tag ${RELEASE_TAG} não pertence à linha de desenvolvimento ${process.env.DEVELOPMENT_BRANCH}.`,
              );
              return;
            }

            try {
              const existing = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${MAINTENANCE_BRANCH}`,
              });
              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: releaseSha,
                head: existing.data.object.sha,
              });
              if (!["ahead", "identical"].includes(comparison.data.status)) {
                core.setFailed(
                  `A branch ${MAINTENANCE_BRANCH} existente não contém o commit publicado ${RELEASE_TAG}.`,
                );
                return;
              }
              core.info(`A branch de manutenção ${MAINTENANCE_BRANCH} já existe.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${MAINTENANCE_BRANCH}`,
                sha: releaseSha,
              });
              core.info(`Branch de manutenção ${MAINTENANCE_BRANCH} criada em ${RELEASE_TAG}.`);
            }

            const openMilestones = await github.paginate(
              github.rest.issues.listMilestones,
              { owner, repo, state: "open", per_page: 100 },
            );
            const ensureMilestone = async (title, description) => {
              const existing = openMilestones.find((item) => item.title === title);
              if (existing) return existing;
              try {
                return (await github.rest.issues.createMilestone({
                  owner,
                  repo,
                  title,
                  description,
                })).data;
              } catch (error) {
                if (error.status !== 422) throw error;
                const refreshed = await github.paginate(
                  github.rest.issues.listMilestones,
                  { owner, repo, state: "open", per_page: 100 },
                );
                const winner = refreshed.find((item) => item.title === title);
                if (!winner) throw error;
                return winner;
              }
            };
            const maintenance = await ensureMilestone(
              MAINTENANCE_MILESTONE,
              `Linha de manutenção ${MAINTENANCE_BRANCH}`,
            );
            const development = await ensureMilestone(
              DEVELOPMENT_MILESTONE,
              "Próxima linha de release de desenvolvimento",
            );

      - name: Open the versioned configuration update PR
        if: steps.rotation.outputs.rotate == 'true'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          EVENT_PATH: ${{ github.event_path }}
          MAINTENANCE_BRANCH: ${{ steps.rotation.outputs.maintenance_branch }}
          MAINTENANCE_MILESTONE: ${{ steps.rotation.outputs.maintenance_milestone }}
          DEVELOPMENT_BRANCH: ${{ steps.rotation.outputs.development_branch }}
          DEVELOPMENT_MILESTONE: ${{ steps.rotation.outputs.development_milestone }}
          RELEASE_VERSION: ${{ steps.rotation.outputs.release_version }}
          RELEASE_TAG: ${{ steps.rotation.outputs.release_tag }}
          PREVIOUS_MAINTENANCE_BRANCH: ${{ steps.rotation.outputs.previous_maintenance_branch }}
          PREVIOUS_MAINTENANCE_MILESTONE: ${{ steps.rotation.outputs.previous_maintenance_milestone }}
          PREVIOUS_DEVELOPMENT_MILESTONE: ${{ steps.rotation.outputs.previous_development_milestone }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo "::error::RELEASE_PLEASE_TOKEN is required to publish the rotation PR." >&2
            exit 1
          fi
          rotation_branch="chore/rotate-release-lines-${RELEASE_TAG//[^A-Za-z0-9._-]/-}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_ref="$(git ls-remote --heads origin "$rotation_branch")"
          if [[ -n "$remote_ref" ]]; then
            git fetch origin "$rotation_branch"
            git switch --track "origin/$rotation_branch"
          else
            git switch -c "$rotation_branch"
          fi
          uv run --project vectora python utils/rotate_release_lines.py "$EVENT_PATH" --write .github/release-lines.json
          maintenance_manifest="$(jq -er '.maintenance.release_please_manifest' .github/release-lines.json)"
          maintenance_config="$(jq -er '.maintenance.release_please_config' .github/release-lines.json)"
          development_config="$(jq -er '.development.release_please_config' .github/release-lines.json)"
          if [[ "$maintenance_manifest" == /* || "$maintenance_manifest" == *..* ]]; then
            echo "::error::O manifesto da linha de manutenção precisa ser um caminho relativo seguro." >&2
            exit 1
          fi
          if [[ "$development_config" == /* || "$development_config" == *..* ]]; then
            echo "::error::A configuração de desenvolvimento precisa ser um caminho relativo seguro." >&2
            exit 1
          fi
          if [[ "$maintenance_config" == /* || "$maintenance_config" == *..* ]]; then
            echo "::error::A configuração de manutenção precisa ser um caminho relativo seguro." >&2
            exit 1
          fi
          python - "$maintenance_manifest" "$RELEASE_VERSION" "$development_config" "$DEVELOPMENT_MILESTONE" <<'PY'
          import json
          import sys
          from pathlib import Path

          # A nova linha de manutenção começa na versão publicada que a criou.
          manifest_path = Path(sys.argv[1])
          version = sys.argv[2].removeprefix("v")
          manifest_path.write_text(
              json.dumps({".": version}, indent=2) + "\n",
              encoding="utf-8",
          )
          config_path = Path(sys.argv[3])
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["release-as"] = f"{sys.argv[4]}.0"
          config_path.write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-lines.json "$maintenance_manifest" "$development_config"
          if git diff --cached --quiet; then
            echo "A configuração da rotação já está commitada."
          else
            git commit -m "chore: rotate release lines for ${RELEASE_TAG}"
          fi
          git push --set-upstream origin "$rotation_branch"
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$rotation_branch" --base "$DEVELOPMENT_BRANCH" --state open --json number --jq 'length == 0' | grep -qx true; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$rotation_branch" \
              --base "$DEVELOPMENT_BRANCH" \
              --milestone "$DEVELOPMENT_MILESTONE" \
              --title "chore: rotate release lines for ${RELEASE_TAG}" \
              --body "$(printf 'Atualiza .github/release-lines.json e o manifesto do Release Please após %s, mantendo as linhas de manutenção e desenvolvimento alinhadas.\n\n<!-- rotation: previous_maintenance_branch=%s; previous_maintenance_milestone=%s; previous_development_milestone=%s -->' \
                "$RELEASE_TAG" "$PREVIOUS_MAINTENANCE_BRANCH" "$PREVIOUS_MAINTENANCE_MILESTONE" "$PREVIOUS_DEVELOPMENT_MILESTONE")"
          else
            echo "Já existe uma PR aberta para a rotação da configuração."
          fi

          # A nova branch precisa nascer com a configuração já apontando para si.
          # Caso a proteção impeça o push direto, publica uma PR de ativação como
          # fallback para que a linha não fique silenciosamente sem Release Please.
          # A referência de fallback é reaproveitada para que uma nova execução
          # atualize a PR existente sem falhar por non-fast-forward.
          maintenance_rotation_branch="chore/activate-${MAINTENANCE_BRANCH//\//-}-${RELEASE_TAG//[^A-Za-z0-9._-]/-}"
          activation_remote_ref="$(git ls-remote --heads origin "refs/heads/$maintenance_rotation_branch" | awk '{print $1}')"
          git fetch origin "$MAINTENANCE_BRANCH"
          git switch --detach "origin/$MAINTENANCE_BRANCH"
          uv run --project vectora python utils/activate_release_line.py \
            "$rotation_branch" . \
            .github/release-lines.json \
            "$maintenance_manifest" \
            "$maintenance_config" \
            "$development_config"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-lines.json "$maintenance_manifest" "$maintenance_config" "$development_config"
          cleanup_activation_fallback() {
            local activation_pr_numbers
            activation_pr_numbers="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$maintenance_rotation_branch" \
              --base "$MAINTENANCE_BRANCH" \
              --state open --json number --jq '.[].number')"
            if [[ -n "$activation_pr_numbers" ]]; then
              while IFS= read -r activation_pr; do
                gh pr close "$activation_pr" \
                  --repo "$GITHUB_REPOSITORY" \
                  --comment "A ativação direta da linha de manutenção foi concluída; esta PR de fallback ficou obsoleta."
              done <<< "$activation_pr_numbers"
            fi
            if [[ -n "$(git ls-remote --heads origin "refs/heads/$maintenance_rotation_branch")" ]]; then
              git push origin --delete "$maintenance_rotation_branch"
            fi
          }
          if git diff --cached --quiet; then
            echo "A branch de manutenção já contém a configuração da rotação."
            cleanup_activation_fallback
          else
            git commit -m "chore: activate ${MAINTENANCE_BRANCH} release line"
            if git push origin "HEAD:$MAINTENANCE_BRANCH"; then
              cleanup_activation_fallback
            else
              if [[ -n "$activation_remote_ref" ]]; then
                git push --force-with-lease="$maintenance_rotation_branch:$activation_remote_ref" \
                  origin "HEAD:$maintenance_rotation_branch"
              else
                git push --set-upstream origin "HEAD:$maintenance_rotation_branch"
              fi
              if gh pr list --repo "$GITHUB_REPOSITORY" \
                --head "$maintenance_rotation_branch" \
                --base "$MAINTENANCE_BRANCH" \
                --state open --json number --jq 'length == 0' | grep -qx true; then
                gh pr create \
                  --repo "$GITHUB_REPOSITORY" \
                  --head "$maintenance_rotation_branch" \
                  --base "$MAINTENANCE_BRANCH" \
                  --milestone "$MAINTENANCE_MILESTONE" \
                  --title "chore: activate ${MAINTENANCE_BRANCH} release line" \
                  --body "Ativa a configuração do Release Please na nova linha ${MAINTENANCE_BRANCH}, criada a partir de ${RELEASE_TAG}."
              else
                echo "Já existe uma PR aberta para ativar a linha de manutenção."
              fi
            fi
          fi
