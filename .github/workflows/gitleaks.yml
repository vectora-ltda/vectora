name: Gitleaks

# Procura segredos na árvore do PR e nos commits que ele traz. Roda a versão do
# próprio PR e não usa segredo nenhum: a ferramenta é compilada de uma versão
# fixa, e a saída nunca mostra o valor encontrado (`--redact`).
on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: v8.30.1

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Install gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@${{ env.GITLEAKS_VERSION }}
      - name: Scan the working tree
        run: gitleaks dir . --redact --no-banner --verbose
      - name: Scan the commits of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --redact --no-banner --verbose --log-opts="$BASE_SHA..$HEAD_SHA"
      - name: Scan the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            gitleaks git . --redact --no-banner --verbose --log-opts="-1 $AFTER_SHA"
          else
            gitleaks git . --redact --no-banner --verbose --log-opts="$BEFORE_SHA..$AFTER_SHA"
          fi
