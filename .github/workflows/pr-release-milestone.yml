name: PR Release Milestone

# Roda a versão do próprio pull request: o checkout é o merge do PR com a base,
# então o validador e a configuração das linhas (`.github/release-lines.json`)
# são os do PR. Em PR de fork o token é somente leitura; a atribuição do
# milestone é pulada e só a validação roda.
on:
  pull_request:
    types:
      [
        opened,
        edited,
        synchronize,
        reopened,
        milestoned,
        demilestoned,
        labeled,
        unlabeled,
      ]
    branches: ["**"]

concurrency:
  group: pr-release-milestone-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  release-milestone:
    name: Validate release milestone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ensure release milestone matches base branch
        id: assign-milestone
        if: github.event.pull_request != null && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          # O token dedicado continua preferido, mas o GITHUB_TOKEN com
          # permissões explícitas evita que a atribuição dependa de um secret
          # ausente em PRs comuns.
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const config = JSON.parse(
              fs.readFileSync(".github/release-lines.json", "utf8"),
            );
            const base = context.payload.pull_request.base.ref;
            const lines = [config.development, config.maintenance];
            let line = lines.find(({ branch }) => branch === base);
            let stackRoot = "";

            // PR empilhada: a base é a branch de outra PR aberta. Segue as
            // bases pelas PRs abertas do repositório até chegar a uma linha de
            // release; a milestone é a da linha que fica na raiz da pilha.
            if (!line) {
              const { owner: repoOwner, repo: repoName } = context.repo;
              const open = await github.paginate(github.rest.pulls.list, {
                owner: repoOwner,
                repo: repoName,
                state: "open",
                per_page: 100,
              });
              const seen = new Set();
              let cursor = base;
              while (cursor && !seen.has(cursor) && seen.size < 20) {
                seen.add(cursor);
                const parent = open.find(
                  (pr) =>
                    pr.head.ref === cursor &&
                    pr.head.repo?.full_name === `${repoOwner}/${repoName}`,
                );
                if (!parent) break;
                cursor = parent.base.ref;
                line = lines.find(({ branch }) => branch === cursor);
                if (line) {
                  stackRoot = cursor;
                  break;
                }
              }
            }
            core.setOutput("stack_root", stackRoot);

            if (!line) {
              core.info(`Skipping unsupported pull-request base: ${base}`);
              return;
            }
            const milestoneTitle = line.milestone;

            // Eventos de sincronização e edição já carregam a milestone atual
            // no payload. Evita uma chamada autenticada desnecessária quando
            // o PR já está correto, inclusive em reexecuções sem credencial de
            // escrita disponível.
            const payloadMilestone =
              context.payload.pull_request.milestone?.title ?? "";
            if (payloadMilestone === milestoneTitle) {
              core.info(
                `Pull request already uses milestone ${milestoneTitle} from the event payload.`,
              );
              core.setOutput("milestone", milestoneTitle);
              core.setOutput("current_milestone", payloadMilestone);
              core.setOutput("current_base", base);
              return;
            }

            const { owner, repo } = context.repo;
            const currentPullRequest = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.issue.number,
            });
            const milestones = await github.paginate(
              github.rest.issues.listMilestones,
              { owner, repo, state: "open", per_page: 100 },
            );
            let milestone = milestones.find(
              ({ title }) => title === milestoneTitle,
            );
            if (!milestone) {
              try {
                const created = await github.rest.issues.createMilestone({
                  owner,
                  repo,
                  title: milestoneTitle,
                  description: `Release line ${line.branch}`,
                });
                milestone = created.data;
                core.info(`Created release milestone ${milestoneTitle}.`);
              } catch (error) {
                if (error.status !== 422) throw error;
                const refreshed = await github.paginate(
                  github.rest.issues.listMilestones,
                  { owner, repo, state: "open", per_page: 100 },
                );
                milestone = refreshed.find(
                  ({ title }) => title === milestoneTitle,
                );
                if (!milestone) throw error;
                core.info(`Reused concurrently created milestone ${milestoneTitle}.`);
              }
            }

            core.setOutput("milestone", milestoneTitle);
            const current = currentPullRequest.data.milestone?.title;
            if (current === milestoneTitle) {
              core.info(`Pull request already uses milestone ${milestoneTitle}.`);
            } else {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: context.issue.number,
                milestone: milestone.number,
              });
              core.info(`Assigned milestone ${milestoneTitle} for base ${base}.`);
            }

            const refreshedPullRequest = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.issue.number,
            });
            core.setOutput(
              "current_milestone",
              refreshedPullRequest.data.milestone?.title ?? "",
            );
            core.setOutput("current_base", refreshedPullRequest.data.base.ref);

      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          all-extras: "false"
          working-directory: .
      - name: Validate milestone and base branch
        run: uv run python utils/release.py validate-milestone
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          CURRENT_RELEASE_MILESTONE: ${{ steps.assign-milestone.outputs.current_milestone || github.event.pull_request.milestone.title }}
          CURRENT_PR_BASE: ${{ steps.assign-milestone.outputs.current_base || github.event.pull_request.base.ref }}
          CURRENT_STACK_ROOT_BASE: ${{ steps.assign-milestone.outputs.stack_root }}
          CURRENT_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CURRENT_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
