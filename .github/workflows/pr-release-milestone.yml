name: PR Release Milestone

# Metadata validation runs in the trusted base context. The pull-request
# revision is never checked out or executed, so contributors cannot replace
# the validator and bypass the release-line gate.
on:
  pull_request_target:
    types:
      [
        opened,
        edited,
        synchronize,
        reopened,
        milestoned,
        demilestoned,
        labeled,
        unlabeled,
      ]
    branches: [master, release/0.1]

concurrency:
  group: pr-release-milestone-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-milestone:
    name: Validate release milestone
    runs-on: ubuntu-latest
    steps:
      # pull_request_target loads this workflow from the base branch; pin the
      # checkout to the base commit explicitly so only trusted validator code
      # is executed, even when the PR changes this file.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate milestone and base branch
        run: python utils/validate_pr_milestone.py
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
