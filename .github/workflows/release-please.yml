name: Release Please

# Cada linha de release ÃƒÂ© calculada a partir do branch confiÃƒÂ¡vel. A PR de
# release atualiza manifesto e changelog; a tag sÃƒÂ³ ÃƒÂ© criada pelo pipeline do
# app depois que a distribuiÃƒÂ§ÃƒÂ£o termina com sucesso. Essa tag dispara este
# workflow para preparar a prÃƒÂ³xima versÃƒÂ£o.

on:
  push:
    branches:
      - master
      - "release/**"
    tags:
      - "v*"

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    # O push que mescla uma PR de release aguarda o build/distribuiÃƒÂ§ÃƒÂ£o do app.
    # A tag criada por vectora.yml ÃƒÂ© o evento que libera esta automaÃƒÂ§ÃƒÂ£o.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      !contains(github.event.head_commit.message, 'chore(master): release '))
    runs-on: ubuntu-24.04
    steps:
      - name: Load release line configuration
        id: release-lines
        uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select configured release line
        id: release-line
        shell: bash
        env:
          TARGET_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! -f .github/release-lines.json ]]; then
            echo "Release-line configuration is not present on the trusted default branch; skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '
            (.development.branch | type == "string" and length > 0) and
            (.maintenance.branch | type == "string" and length > 0) and
            (.development.milestone | type == "string" and length > 0) and
            (.maintenance.milestone | type == "string" and length > 0) and
            (.development.branch != .maintenance.branch)
          ' .github/release-lines.json >/dev/null
          development_branch="$(jq -er '.development.branch' .github/release-lines.json)"
          maintenance_branch="$(jq -er '.maintenance.branch' .github/release-lines.json)"
          development_milestone="$(jq -er '.development.milestone' .github/release-lines.json)"
          maintenance_milestone="$(jq -er '.maintenance.milestone' .github/release-lines.json)"
          release_milestone=""
          if [[ "$TARGET_BRANCH" == "$development_branch" ]]; then
            line_key="development"
            release_milestone="$development_milestone"
          elif [[ "$TARGET_BRANCH" == "$maintenance_branch" ]]; then
            line_key="maintenance"
            release_milestone="$maintenance_milestone"
          else
            line_key=""
          fi
          if [[ -n "$line_key" ]]; then
            if [[ "$line_key" == "development" ]]; then
              release_target_branch="$maintenance_branch"
            else
              release_target_branch="$maintenance_branch"
            fi
            config_file="$(jq -er ".${line_key}.release_please_config" .github/release-lines.json)"
            manifest_file="$(jq -er ".${line_key}.release_please_manifest" .github/release-lines.json)"
            if [[ "$config_file" == /* || "$config_file" == *..* || "$manifest_file" == /* || "$manifest_file" == *..* ]]; then
              echo "::error::Os caminhos do Release Please devem ser relativos e nÃƒÂ£o podem subir diretÃƒÂ³rios." >&2
              exit 1
            fi
            test -f "$config_file" || { echo "::error::ConfiguraÃƒÂ§ÃƒÂ£o ausente: $config_file" >&2; exit 1; }
            test -f "$manifest_file" || { echo "::error::Manifesto ausente: $manifest_file" >&2; exit 1; }
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            config_file=""
            manifest_file=""
            release_target_branch=""
          fi
          {
            echo "development_branch=$development_branch"
            echo "maintenance_branch=$maintenance_branch"
            echo "development_milestone=$development_milestone"
            echo "maintenance_milestone=$maintenance_milestone"
            echo "config_file=$config_file"
            echo "manifest_file=$manifest_file"
            echo "release_target_branch=$release_target_branch"
            echo "release_milestone=$release_milestone"
          } >> "$GITHUB_OUTPUT"
          if [[ "$(grep '^enabled=' "$GITHUB_OUTPUT" | tail -n 1)" == "enabled=false" ]]; then
            echo "Skipping release-please on unconfigured branch $TARGET_BRANCH."
          fi
      - name: Check for merged release candidates
        id: release-candidates
        if: steps.release-line.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
          DEVELOPMENT_MILESTONE: ${{ steps.release-line.outputs.development_milestone }}
          MAINTENANCE_MILESTONE: ${{ steps.release-line.outputs.maintenance_milestone }}
          RELEASE_MILESTONE: ${{ steps.release-line.outputs.release_milestone }}
          CANDIDATE_BASE_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin
          latest_tag="$(git tag --merged "origin/$TARGET_BRANCH" --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -n "$latest_tag" ]]; then
            latest_tag_epoch="$(git show -s --format=%ct "$latest_tag")"
          else
            latest_tag_epoch=0
          fi
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$CANDIDATE_BASE_BRANCH" --state merged --limit 100 --json milestone,labels,mergedAt)"
          has_candidates="$(jq -r --arg milestone "$RELEASE_MILESTONE" --argjson latest_tag_epoch "$latest_tag_epoch" '
            any(.[]; (.milestone.title? == $milestone) and (.mergedAt != null) and ((.mergedAt | fromdateiso8601) > $latest_tag_epoch) and (([.labels[].name] | index("autorelease: pending")) == null))
          ' <<< "$prs")"
          echo "has_candidates=$has_candidates" >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@v5
        if: steps.release-line.outputs.enabled == 'true' && steps.release-candidates.outputs.has_candidates == 'true'
        id: release
        with:
          token: ${{ github.token }}
          config-file: ${{ steps.release-line.outputs.config_file }}
          manifest-file: ${{ steps.release-line.outputs.manifest_file }}
          target-branch: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
          skip-github-release: true
          # O Release Please deve manter `autorelease: pending`: a validação
          # do branch confiável e a exceção de milestone dependem desse label.

      - uses: ./.github/actions/setup-uv
        if: steps.release-line.outputs.enabled == 'true'
        with:
          python-version: "3.13"
          all-extras: "false"
          working-directory: vectora

      - name: Find canonical release branch PR
        if: steps.release-line.outputs.enabled == 'true'
        id: canonical-release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
          RELEASE_TARGET_BRANCH: ${{ steps.release-line.outputs.release_target_branch }}
          RELEASE_MILESTONE: ${{ steps.release-line.outputs.release_milestone }}
        shell: bash
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$TARGET_BRANCH" --state open --limit 100 --json number,headRefName,headRefOid,headRepository,title,body,labels,baseRefName)"
          pr="$(uv run --project vectora python utils/select_release_pr.py \
            --repository "$GITHUB_REPOSITORY" --source "$TARGET_BRANCH" \
            --target "$RELEASE_TARGET_BRANCH" --milestone "$RELEASE_MILESTONE" \
            --phase generated <<< "$prs")"
          source="$(jq -r '.headRefName // empty' <<< "$pr")"
          if [[ -z "$source" ]]; then
            echo "No legacy Release Please branch needs renaming."
            exit 0
          fi
          version="$(jq -r 'try (.title | capture("release (?<version>[0-9]+\\.[0-9]+\\.[0-9]+)").version) catch ""' <<< "$pr")"
          if [[ -z "$version" ]]; then
            echo "::error::Não foi possível obter a versão da PR automática." >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          if [[ "$patch" == "0" ]]; then target="release/${major}.${minor}"; else target="release/${version}"; fi
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$RELEASE_TARGET_BRANCH" --head "$target" --state open --json number,headRefName,headRefOid,headRepository,title,body,labels,baseRefName)"
          selected="$(uv run --project vectora python utils/select_release_pr.py \
            --repository "$GITHUB_REPOSITORY" --source "$TARGET_BRANCH" \
            --target "$RELEASE_TARGET_BRANCH" --milestone "$RELEASE_MILESTONE" \
            <<< "$prs")"
          echo "number=$(jq -r '.number // empty' <<< "$selected")" >> "$GITHUB_OUTPUT"

      # Somente a branch canônica da linha pode receber o token de publicação.
      - name: Find canonical release branch
        if: steps.release-line.outputs.enabled == 'true' && steps.release-candidates.outputs.has_candidates == 'true'
        id: release-branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
          RELEASE_TARGET_BRANCH: ${{ steps.release-line.outputs.release_target_branch }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_MILESTONE: ${{ steps.release-line.outputs.release_milestone }}
        shell: bash
        run: |
          set -euo pipefail
          prs="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,headRefName,headRefOid,headRepository,labels,title,baseRefName)"
          pr="$(uv run --project vectora python utils/select_release_pr.py \
            --repository "$REPOSITORY" --source "$TARGET_BRANCH" \
            --target "$RELEASE_TARGET_BRANCH" --milestone "$RELEASE_MILESTONE" \
            <<< "$prs")"
          branch="$(jq -r '.headRefName // empty' <<<"$pr")"
          number="$(jq -r '.number // empty' <<<"$pr")"
          if [[ -z "$branch" ]]; then
            echo "No trusted Release Please PR found for $RELEASE_TARGET_BRANCH."
            exit 0
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check out Release Please branch
        if: steps.release-line.outputs.enabled == 'true' && steps.release-branch.outputs.branch != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-branch.outputs.branch }}
          token: ${{ github.token }}
          persist-credentials: false

      - uses: ./.github/actions/setup-uv
        if: steps.release-line.outputs.enabled == 'true' && steps.release-branch.outputs.branch != ''
        with:
          python-version: "3.13"
          all-extras: "false"
          working-directory: vectora

      - name: Normalize generated changelog list markers
        if: steps.release-line.outputs.enabled == 'true' && steps.release-branch.outputs.branch != ''
        run: python utils/normalize_changelog_lists.py

      - name: Align release lines in the Release Please PR
        if: steps.release-line.outputs.enabled == 'true' && steps.release-branch.outputs.branch != ''
        env:
          TARGET_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
        run: |
          uv run --project vectora python utils/prepare_release_line_config.py \
            vectora/CHANGELOG.md \
            .github/release-lines.json \
            .release-please-manifest.maintenance.json \
            "$TARGET_BRANCH"

      - name: Prepare current release section for PR body
        if: steps.release-line.outputs.enabled == 'true' && steps.release-branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release-branch.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          python utils/prepare_release_pr_body.py \
            vectora/CHANGELOG.md "$RUNNER_TEMP/release-pr-body.md"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/release-pr-body.md"

      # Release Please can persist an oversized generated body in a secondary
      # `--release-notes` branch. The versioned release PR is the source of
      # truth, so remove that implementation detail after its body is prepared.
      - name: Remove generated release-notes branch
        if: steps.release-line.outputs.enabled == 'true' && steps.release-branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_target="${TARGET_BRANCH//\//%2F}"
          release_prefix="release-please"
          branch_segment="--branches--"
          component_segment="--components--vectora--release-notes"
          prefix="${release_prefix}${branch_segment}${encoded_target}${component_segment}"
          refs="$(gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$prefix" \
            --jq '.[].ref' || true)"
          while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            echo "Removing obsolete Release Please notes ref $ref"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/${ref#refs/}"
          done <<< "$refs"

      - name: Commit normalized changelog
        if: steps.release-line.outputs.enabled == 'true' && steps.release-branch.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.release-branch.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- vectora/CHANGELOG.md .github/release-lines.json .release-please-manifest.maintenance.json; then
            echo "Generated release files are already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vectora/CHANGELOG.md .github/release-lines.json .release-please-manifest.maintenance.json
          git commit -m "chore: align release lines for generated release"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:$RELEASE_BRANCH"
