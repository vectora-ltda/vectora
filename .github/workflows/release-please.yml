name: Release Please

# Cada linha de release é calculada a partir do branch confiável. A PR de
# release atualiza manifesto e changelog; a tag só é criada pelo pipeline do
# app depois que a distribuição termina com sucesso. Essa tag dispara este
# workflow para preparar a próxima versão.

on:
  push:
    branches:
      - master
      - "release/**"
    tags:
      - "v*"

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    # O push que mescla uma PR de release aguarda o build/distribuição do app.
    # A tag criada por vectora.yml é o evento que libera esta automação.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      !contains(github.event.head_commit.message, 'chore(master): release '))
    runs-on: ubuntu-24.04
    steps:
      - name: Load release line configuration
        id: release-lines
        uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select configured release line
        id: release-line
        shell: bash
        env:
          TARGET_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! -f .github/release-lines.json ]]; then
            echo "Release-line configuration is not present on the trusted default branch; skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '
            (.development.branch | type == "string" and length > 0) and
            (.maintenance.branch | type == "string" and length > 0) and
            (.development.milestone | type == "string" and length > 0) and
            (.maintenance.milestone | type == "string" and length > 0) and
            (.development.branch != .maintenance.branch)
          ' .github/release-lines.json >/dev/null
          development_branch="$(jq -er '.development.branch' .github/release-lines.json)"
          maintenance_branch="$(jq -er '.maintenance.branch' .github/release-lines.json)"
          development_milestone="$(jq -er '.development.milestone' .github/release-lines.json)"
          maintenance_milestone="$(jq -er '.maintenance.milestone' .github/release-lines.json)"
          release_milestone=""
          if [[ "$TARGET_BRANCH" == "$development_branch" ]]; then
            line_key="development"
            release_milestone="$development_milestone"
          elif [[ "$TARGET_BRANCH" == "$maintenance_branch" ]]; then
            line_key="maintenance"
            release_milestone="$maintenance_milestone"
          else
            line_key=""
          fi
          if [[ -n "$line_key" ]]; then
            if [[ "$line_key" == "development" ]]; then
              release_target_branch="$maintenance_branch"
            else
              release_target_branch="$maintenance_branch"
            fi
            config_file="$(jq -er ".${line_key}.release_please_config" .github/release-lines.json)"
            manifest_file="$(jq -er ".${line_key}.release_please_manifest" .github/release-lines.json)"
            if [[ "$config_file" == /* || "$config_file" == *..* || "$manifest_file" == /* || "$manifest_file" == *..* ]]; then
              echo "::error::Os caminhos do Release Please devem ser relativos e não podem subir diretórios." >&2
              exit 1
            fi
            test -f "$config_file" || { echo "::error::Configuração ausente: $config_file" >&2; exit 1; }
            test -f "$manifest_file" || { echo "::error::Manifesto ausente: $manifest_file" >&2; exit 1; }
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            config_file=""
            manifest_file=""
            release_target_branch=""
          fi
          {
            echo "development_branch=$development_branch"
            echo "maintenance_branch=$maintenance_branch"
            echo "development_milestone=$development_milestone"
            echo "maintenance_milestone=$maintenance_milestone"
            echo "config_file=$config_file"
            echo "manifest_file=$manifest_file"
            echo "release_target_branch=$release_target_branch"
            echo "release_milestone=$release_milestone"
          } >> "$GITHUB_OUTPUT"
          if [[ "$(grep '^enabled=' "$GITHUB_OUTPUT" | tail -n 1)" == "enabled=false" ]]; then
            echo "Skipping release-please on unconfigured branch $TARGET_BRANCH."
          fi
      - name: Check for merged release candidates
        id: release-candidates
        if: steps.release-line.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
          DEVELOPMENT_MILESTONE: ${{ steps.release-line.outputs.development_milestone }}
          MAINTENANCE_MILESTONE: ${{ steps.release-line.outputs.maintenance_milestone }}
          RELEASE_MILESTONE: ${{ steps.release-line.outputs.release_milestone }}
          RELEASE_MANIFEST: ${{ startsWith(github.ref, 'refs/tags/v') && '.release-please-manifest.maintenance.json' || (github.ref_name == steps.release-line.outputs.development_branch && '.release-please-manifest.development.json' || '.release-please-manifest.maintenance.json') }}
          CANDIDATE_BASE_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin
          latest_tag="$(git tag --merged "origin/$TARGET_BRANCH" --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -n "$latest_tag" ]]; then
            latest_tag_epoch="$(git show -s --format=%ct "$latest_tag")"
          else
            latest_tag_epoch=0
          fi
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$CANDIDATE_BASE_BRANCH" --state merged --limit 100 --json milestone,labels,mergedAt)"
          has_candidates="$(jq -r --arg milestone "$RELEASE_MILESTONE" --argjson latest_tag_epoch "$latest_tag_epoch" '
            any(.[]; (.milestone.title? == $milestone) and (.mergedAt != null) and ((.mergedAt | fromdateiso8601) > $latest_tag_epoch) and (([.labels[].name] | index("autorelease: pending")) == null))
          ' <<< "$prs")"
          echo "has_candidates=$has_candidates" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-uv
        if: steps.release-line.outputs.enabled == 'true'
        with:
          python-version: "3.13"
          all-extras: "false"
          working-directory: vectora

      - name: Build canonical release plan
        if: steps.release-line.outputs.enabled == 'true' && steps.release-candidates.outputs.has_candidates == 'true'
        id: release-plan
        env:
          TARGET_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event.repository.default_branch || github.ref_name }}
          RELEASE_MILESTONE: ${{ steps.release-line.outputs.release_milestone }}
          DEVELOPMENT_BRANCH: ${{ steps.release-line.outputs.development_branch }}
          MAINTENANCE_BRANCH: ${{ steps.release-line.outputs.maintenance_branch }}
          RELEASE_MANIFEST: ${{ startsWith(github.ref, 'refs/tags/v') && '.release-please-manifest.maintenance.json' || (github.ref_name == steps.release-line.outputs.development_branch && '.release-please-manifest.development.json' || '.release-please-manifest.maintenance.json') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == "$DEVELOPMENT_BRANCH" || "$TARGET_BRANCH" == "$MAINTENANCE_BRANCH" ]]; then
            source_ref="origin/$TARGET_BRANCH"
          else
            echo "Skipping unconfigured source branch $TARGET_BRANCH."
            exit 0
          fi
          latest_tag="$(git tag --merged "$source_ref" --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -n "$latest_tag" ]]; then
            git log --format='%s%x1f%b%x1e' "$latest_tag..$source_ref" | jq -R -s 'split("\u001e") | map(select(length > 0)) | map({subject: (split("\u001f")[0]), body: (split("\u001f")[1] // "")})' > "$RUNNER_TEMP/release-commits.json"
          else
            git log --format='%s%x1f%b%x1e' "$source_ref" | jq -R -s 'split("\u001e") | map(select(length > 0)) | map({subject: (split("\u001f")[0]), body: (split("\u001f")[1] // "")})' > "$RUNNER_TEMP/release-commits.json"
          fi
          current_version="$(jq -er '.["."]' "$([ "$TARGET_BRANCH" = "$DEVELOPMENT_BRANCH" ] && echo .release-please-manifest.development.json || echo .release-please-manifest.maintenance.json)")"
          bump_flag=""
          [[ "$RELEASE_MILESTONE" == *.x ]] && bump_flag="--bump-patch-for-minor-pre-major"
          uv run --project vectora python utils/release_plan.py \
            --current-version "$current_version" \
            --commits-json "$RUNNER_TEMP/release-commits.json" \
            --manifest "$RELEASE_MANIFEST" \
            --files vectora/pyproject.toml vectora/frontend/package.json services/package.json company/package.json vectora/uv.lock \
            $bump_flag > "$RUNNER_TEMP/release-plan.json"
          next_version="$(jq -er '.next_version' "$RUNNER_TEMP/release-plan.json")"
          bump="$(jq -er '.bump' "$RUNNER_TEMP/release-plan.json")"
          if [[ "$bump" == "none" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$TARGET_BRANCH" == "$DEVELOPMENT_BRANCH" ]]; then
            release_branch="$TARGET_BRANCH"
          else
            release_branch="release/$next_version"
          fi
          if [[ "$release_branch" == *release-please--* || "$release_branch" == *--branches--* || "$release_branch" == *--components--* ]]; then
            echo "::error::Ref de release inválida: $release_branch" >&2
            exit 1
          fi
          {
            echo "enabled=true"
            echo "branch=$release_branch"
            echo "version=$next_version"
          } >> "$GITHUB_OUTPUT"

      - name: Create canonical release branch
        if: steps.release-plan.outputs.enabled == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.release-plan.outputs.branch }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "Canonical branch $RELEASE_BRANCH already exists."
          else
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "$SOURCE_SHA:refs/heads/$RELEASE_BRANCH"
          fi

      - name: Check out canonical release branch
        if: steps.release-plan.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-plan.outputs.branch }}
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply release files
        if: steps.release-plan.outputs.enabled == 'true'
        env:
          RELEASE_MILESTONE: ${{ steps.release-line.outputs.release_milestone }}
          RELEASE_MANIFEST: ${{ startsWith(github.ref, 'refs/tags/v') && '.release-please-manifest.maintenance.json' || (github.ref_name == steps.release-line.outputs.development_branch && '.release-please-manifest.development.json' || '.release-please-manifest.maintenance.json') }}
        shell: bash
        run: |
          set -euo pipefail
          bump_flag=""
          [[ "$RELEASE_MILESTONE" == *.x ]] && bump_flag="--bump-patch-for-minor-pre-major"
          current_version="$(jq -er '.["."]' "$RELEASE_MANIFEST")"
          uv run --project vectora python utils/release_plan.py \
            --current-version "$current_version" \
            --commits-json "$RUNNER_TEMP/release-commits.json" \
            --manifest "$RELEASE_MANIFEST" \
            --files vectora/pyproject.toml vectora/frontend/package.json services/package.json company/package.json vectora/uv.lock \
            --apply $bump_flag
          python utils/normalize_changelog_lists.py

      - name: Commit and push canonical release branch
        if: steps.release-plan.outputs.enabled == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.release-plan.outputs.branch }}
          RELEASE_VERSION: ${{ steps.release-plan.outputs.version }}
          RELEASE_MANIFEST: ${{ startsWith(github.ref, 'refs/tags/v') && '.release-please-manifest.maintenance.json' || (github.ref_name == steps.release-line.outputs.development_branch && '.release-please-manifest.development.json' || '.release-please-manifest.maintenance.json') }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Release branch is already up to date."
          else
            git add "$RELEASE_MANIFEST" vectora/CHANGELOG.md vectora/pyproject.toml vectora/frontend/package.json services/package.json company/package.json vectora/uv.lock
            git commit -m "chore(master): release $RELEASE_VERSION"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi

      - name: Create or update canonical release PR
        if: steps.release-plan.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release-plan.outputs.branch }}
          RELEASE_TARGET_BRANCH: ${{ steps.release-line.outputs.release_target_branch }}
          RELEASE_MILESTONE: ${{ steps.release-line.outputs.release_milestone }}
          RELEASE_VERSION: ${{ steps.release-plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python utils/prepare_release_pr_body.py vectora/CHANGELOG.md "$RUNNER_TEMP/release-pr-body.md"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base "$RELEASE_TARGET_BRANCH" --state open --json number --jq '.[0].number // empty')"
          title="chore(master): release $RELEASE_VERSION"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/release-pr-body.md" --add-label "autorelease: pending" --milestone "$RELEASE_MILESTONE"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$RELEASE_TARGET_BRANCH" --head "$RELEASE_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/release-pr-body.md" --label "autorelease: pending" --milestone "$RELEASE_MILESTONE"
          fi
