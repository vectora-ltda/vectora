name: Release Please

# Mantém um único PR "chore(master): release X.Y.Z" sempre atualizado com o
# changelog acumulado desde a última release e a versão calculada a partir
# dos títulos de PR (Conventional Commits) mesclados em master. Nada é
# publicado sozinho — publicar é decisão do usuário: mesclar esse PR é o
# que cria a tag vX.Y.Z, que dispara vectora.yml (release-native +
# publish-update-channel). Sem esse merge, PRs normais só acumulam.

on:
  push:
    branches: [master]

# Apenas uma execução pode atualizar o PR de release e suas labels por vez.
# Isso evita que duas execuções removam a mesma label simultaneamente.
concurrency:
  group: release-please-master
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN padrão não dispara outros workflows pelos eventos que
      # ele mesmo cria (proteção anti-loop do GitHub) — a tag vX.Y.Z criada
      # pela action nunca ativava vectora.yml (release-native +
      # publish-update-channel ficavam pulados pra sempre). Token pessoal
      # não tem essa restrição.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
