name: PR Checks Comment

# Companheiro de pr-checks.yml::no-plan-metadata. Comentar no PR exige
# `pull-requests: write`, mas o job que processa título/corpo do PR (dado
# potencialmente hostil, ex. fork) nunca pode carregar esse token com
# permissão de escrita — em fork o GitHub já reduz pra leitura mesmo se o
# workflow pedir mais, mas a separação aqui é por design: validação sem
# escrita num job, comentário disparado à parte via `workflow_run` (roda no
# contexto do branch base, token confiável) só depois que a validação
# terminou.

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - name: Baixa o número do PR reprovado (se o job de validação subiu um)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: no-plan-metadata-failure
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Comenta no PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("pr-number.txt")) return;
            const prNumber = parseInt(fs.readFileSync("pr-number.txt", "utf8").trim(), 10);
            if (!prNumber) return;
            const message = `**Título/descrição do PR com proveniência de processo**

              Título e descrição não podem referenciar Sprint/Bloco/Fase nem ferramenta/revisor de IA (CodeRabbit, Claude, Copilot, etc) — mesma regra dos comentários de código (CLAUDE.md §1, que cobre também mensagens de PR).

              Descreva só o que a mudança faz; histórico de planejamento vai em \`docs/\` ou \`.claude/plans/\`.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const already = comments.some((c) => c.body === message);
            if (!already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: message,
              });
            }
