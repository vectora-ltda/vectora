name: Vectora (app)

# Pipeline do app Vectora (backend Python + frontend Vite + casca Electron).
#
# Fluxo PR-based: lint/security/frontend/build/testes rodam sempre — em
# todo PR contra master e em todo push em master (merge de PR) — sem gate
# manual. O que continua caro e gated é só a matriz de release nativa
# (Nuitka/Electron, macOS 10x + Windows 2x o custo de minutos): só dispara
# numa tag "v*" real (criada por release-please.yml quando o usuário
# mescla o PR de release acumulado) ou por workflow_dispatch manual —
# nunca em PR nem em push comum de master.
# `paths` restringe esse pipeline (caro: lint+security+frontend+build+testes)
# a mudanças que realmente afetam o app Vectora — company/services/docs têm
# ciclo próprio (.github/workflows/edge.yml), rodar os dois juntos em todo PR
# era desperdício de minutos de CI e ruído de check irrelevante. Tag "v*" cai
# no mesmo filtro sem risco: o commit que a tag aponta é sempre o bump de
# versão do release-please em vectora/pyproject.toml, que já bate no path.
on:
  push:
    branches: [master, publish-edge-production]
    tags: ["v*"]
    paths:
      - "vectora/**"
      - ".github/workflows/vectora.yml"
      - ".github/actions/**"
  pull_request:
    branches: [master]
    paths:
      - "vectora/**"
      - ".github/workflows/vectora.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: vectora

env:
  # 3.13: versão que o uv resolve (cpython-3.13) e a única suportada pelo
  # Nuitka 4.1.x. 3.14 só vira oficial no Nuitka 4.2.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "26"

jobs:
  # ── 1. Lint & Format ────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff check
        run: uv run ruff check backend tests
      - name: Ruff format check
        run: uv run ruff format --check backend tests
      - name: Type check (ty)
        run: uv run ty check backend tests

  # ── 2. Security Scanning ────────────────────────────────────────────────
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bandit (static security analysis)
        run: uv run bandit -c pyproject.toml -r backend || true
      - name: pip-audit (vulnerable dependencies)
        run: uv run --with pip-audit pip-audit || true

  # ── 2b. Frontend (oxlint + tsc + vitest) ────────────────────────────────
  # O job `lint` cobre só o Python (ruff + ty). A suíte TypeScript — lint
  # (oxlint), type check (tsc --noEmit) e testes (vitest) — roda aqui. i18n e
  # rotas (Paraglide + TanStack Router) são gerados antes; ambos são pré-req do
  # tsc e do vitest.
  frontend:
    name: Frontend (lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Install deps
        working-directory: vectora/frontend
        run: pnpm install --frozen-lockfile
      - name: Compile i18n messages (Paraglide)
        working-directory: vectora/frontend
        run: pnpm i18n:compile
      - name: Lint (oxlint)
        working-directory: vectora/frontend
        run: pnpm exec oxlint
      - name: Lint i18n (no hardcoded UI strings)
        working-directory: vectora/frontend
        run: pnpm lint:i18n -- --changed
      - name: Type check (tsc --noEmit)
        working-directory: vectora/frontend
        run: pnpm typecheck
      - name: Unit tests (vitest)
        working-directory: vectora/frontend
        run: pnpm test

  # ── 3. Build Verification (backend compile + frontend SPA) ──────────────
  build_verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, security, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile backend
        run: uv run python -m compileall backend
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Build frontend SPA
        # cwd=vectora/frontend (não `--dir`): o pnpm resolve allowBuilds (sharp)
        # a partir do cwd; de fora de frontend/ ele não lê o pnpm-workspace.yaml
        # e o install aborta com ERR_PNPM_IGNORED_BUILDS.
        working-directory: vectora/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  # ── 4a. Unit Tests ──────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || 'test-key' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || 'test-key' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || 'test-key' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=false
          ENABLE_WEB_FETCH=false
          EOF
      # Sem --cov de propósito: já foi removido daqui como tentativa de
      # mitigar o hang abaixo — não resolveu (hang idêntico sem --cov),
      # mantido fora só porque cobertura deve ser um job dedicado de
      # qualquer forma, sem competir por CPU com o gate de tempo dos testes.
      # Hipótese de esgotamento de fd (ulimit -n) testada e descartada —
      # hang idêntico com o limite bem mais alto.
      #
      # DIAGNÓSTICO — hang intermitente (mas frequente) sempre no mesmo
      # padrão (ver pyproject.toml [tool.pytest.ini_options] pro histórico
      # completo da investigação): roda o pytest em background e, se ainda
      # estiver vivo aos 250s (o hang real trava os 300s inteiros do
      # timeout do pytest — nunca "quase termina"), captura o estado NATIVO
      # de cada thread via /proc (wchan = função do kernel em que a thread
      # está bloqueada de verdade) e via py-spy (stack nativo C + Python
      # juntos) ANTES do timeout_method=thread matar o processo — o
      # faulthandler do próprio pytest só mostra o frame Python, não a
      # razão real do bloqueio no kernel.
      # LANCE_IO_THREADS/LANCE_CPU_THREADS: testando a hipótese de que o
      # runtime tokio interno do Lance entra numa configuração degenerada
      # de threadpool em runners com poucos vCPUs (achado real — ver
      # github.com/lancedb/lancedb/issues/2326 — "Number of CPUs is less
      # than or equal to the number of IO core reservations"). Sem
      # confirmação de que isso causa o hang em si, só um warning
      # documentado, mas é testável e barato.
      - name: Run unit tests
        env:
          LANCE_IO_THREADS: "1"
          LANCE_CPU_THREADS: "1"
        run: |
          echo "nproc: $(nproc)"
          uv run pytest tests/unit/ -v -m "not live and not real_lancedb" &
          UV_PID=$!
          (
            sleep 250
            if kill -0 "$UV_PID" 2>/dev/null; then
              echo "::group::DIAGNÓSTICO — pytest ainda vivo aos 250s"
              # $UV_PID é o processo `uv` (wrapper) — o Python/pytest real é
              # um FILHO dele. 1ª tentativa deste diagnóstico mirou o PID
              # errado (mostrou só as 2 threads triviais do uv em si:
              # futex_do_wait esperando o filho + ep_poll do runtime do uv).
              PY_PID=$(pgrep -P "$UV_PID" | head -1)
              if [ -z "$PY_PID" ]; then PY_PID="$UV_PID"; fi
              echo "uv_pid=$UV_PID python_pid=$PY_PID"
              echo "--- threads do processo Python: tid | comm | wchan (função do kernel bloqueando) ---"
              for t in /proc/"$PY_PID"/task/*/; do
                tid=$(basename "$t")
                wchan=$(cat "$t/wchan" 2>/dev/null || echo "?")
                comm=$(cat "$t/comm" 2>/dev/null || echo "?")
                echo "tid=$tid comm=$comm wchan=$wchan"
              done
              echo "--- fds abertos: $(ls "/proc/$PY_PID/fd" 2>/dev/null | wc -l) ---"
              # py-spy: bloqueado por ptrace neste runner mesmo com sudo
              # ("Permission Denied" mesmo com PATH preservado) — desistido,
              # não é contornável sem privilégio que o runner não concede.
              echo "--- backend/storage/sqlite/pool.py::_new_conn diag (arquivo, não stream) ---"
              cat /tmp/vectora_pool_diag.log 2>/dev/null || echo "(arquivo não existe — _new_conn nunca chamado neste hang)"
              echo "::endgroup::"
            fi
          ) &
          WATCHDOG_PID=$!
          wait "$UV_PID"
          PYTEST_EXIT=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit $PYTEST_EXIT
      # Testes marcados `real_lancedb` chamam lancedb.connect_async() sem
      # mock — travam de forma determinística no Linux CI (ver comentário
      # completo em pyproject.toml [tool.pytest.ini_options], seção
      # `timeout`). Rodam num subprocesso do SO isolado (`timeout` do
      # coreutils, não fork — fork causa segfault no runtime nativo do
      # LanceDB, jemalloc não é fork-safe) com prazo próprio e curto; um
      # travamento (exit 124) ou crash nativo (exit 128+sinal, ex. 139 =
      # SIGSEGV) aqui vira warning, não falha o job — sem isso, o bug
      # upstream do LanceDB bloquearia todo PR indefinidamente.
      - name: Run real LanceDB isolated tests
        run: |
          set +e
          timeout 90s uv run pytest tests/unit/ -v -m real_lancedb --timeout=60 --tb=short
          EXIT=$?
          set -e
          if [ $EXIT -eq 124 ] || [ $EXIT -ge 128 ]; then
            echo "::warning::testes reais de LanceDB travaram ou crasharam na CI (bug upstream conhecido, não bloqueando o job) — exit $EXIT"
            exit 0
          fi
          exit $EXIT
      - name: Run stress tests
        run: uv run pytest tests/stress/ -v --timeout=120 --tb=short

  # ── 4b. Integration + E2E (gate do Docker; precisam de chaves reais) ────
  test-external:
    name: Integration + E2E Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || '' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || '' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || '' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=true
          ENABLE_WEB_FETCH=true
          EOF
      - name: Integration tests
        run: uv run pytest tests/integration/ -v --timeout=120 -p no:randomly --tb=short -m "not storage and not singularity"
      - name: E2E tests
        run: uv run pytest tests/e2e/ -v --timeout=180 --tb=short

  # ── 5. Release Native Binaries (Nuitka onefile + Electron installers) ───
  # Matriz cara: macOS (multiplicador 10x de minutos) e Windows (2x). Por
  # isso roda SÓ numa tag "v*" real (criada por release-please.yml quando o
  # usuário mescla o PR de release acumulado) ou disparo manual
  # (workflow_dispatch) — nunca em PR nem em push comum de master. Publicar
  # é o propósito de rodar essa matriz de qualquer forma: sempre que ela
  # roda (por qualquer um dos dois gatilhos), a GitHub Release
  # (--publish always) e o canal de update (R2/KV, job publish-update-channel
  # abaixo) são publicados juntos — não há um terceiro estado de "buildar sem
  # publicar".
  release-native:
    name: Release native (${{ matrix.target }}/${{ matrix.arch }})
    needs: [test-unit, test-external]
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master') ||
      (github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/publish-edge-production')
    env:
      # Nuitka escolhe clang/gcc + ccache no Linux/macOS, MSVC + clcache
      # (vendorizado dentro do próprio pacote nuitka) no Windows — cada um lê
      # sua própria env var de diretório de cache.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: linux
          - os: macos-26
            arch: arm64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          all-extras: "false"
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Build frontend SPA (Vite)
        working-directory: vectora/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install ccache (Linux/macOS)
        # Windows não entra aqui: o Nuitka usa clcache (vendorizado dentro
        # do próprio pacote nuitka) no MSVC, não o binário ccache.
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y ccache ;;
            macOS) brew install ccache ;;
          esac
      - name: Cache ccache (Nuitka C compilation)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          # Chave por SO/arch + hash do backend: cache miss só quando o
          # backend muda de verdade; restore-keys garante reuso parcial
          # (objetos não afetados pela mudança) mesmo em cache miss.
          key: ccache-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('vectora/backend/**') }}
          restore-keys: |
            ccache-${{ matrix.target }}-${{ matrix.arch }}-
      - name: Cache nats-server binary
        uses: actions/cache@v6
        with:
          path: vectora/resources/nats-server*
          key: nats-server-${{ matrix.target }}-${{ matrix.arch }}
      - name: Fetch nats-server binary
        # build-hybrid.py falha rápido se vectora/resources/nats-server
        # (ou .exe) não existir — o sidecar de fila/KV precisa vir embutido
        # no build standalone, não só no desktop Electron. `scons nats`
        # baixa o binário certo pra plataforma do runner atual. `scons` só
        # existe dentro do venv que o `uv sync` cria em vectora/ (setup-uv
        # roda com working-directory: vectora) — nunca vai pro PATH do
        # shell. `uv run --project vectora` resolve esse venv mantendo o
        # cwd na raiz do monorepo, onde o SConstruct está.
        working-directory: .
        run: uv run --project vectora scons nats
        shell: bash
      - name: Cache ffmpeg/ffprobe binaries
        uses: actions/cache@v6
        with:
          path: |
            vectora/resources/ffmpeg*
            vectora/resources/ffprobe*
          key: ffmpeg-${{ matrix.target }}-${{ matrix.arch }}
      - name: Fetch ffmpeg/ffprobe binaries
        # Mesmo motivo/padrão do nats acima — build-hybrid.py também falha
        # rápido sem vectora/resources/ffmpeg(.exe)/ffprobe(.exe)
        # (transcrição/análise de mídia local precisa deles embutidos).
        working-directory: .
        run: uv run --project vectora scons ffmpeg
        shell: bash
      - name: Build hybrid (Nuitka backend.pyd + PyInstaller onedir)
        # Mesmo pipeline que `scons release` roda localmente
        # (build-hybrid.py, na raiz do monorepo — não em vectora/): Nuitka
        # --mode=package compila só o pacote backend pra backend.pyd, depois
        # PyInstaller empacota launcher.py + backend.pyd + libs em
        # dist/vectora/ (onedir). working-directory sobrescreve o default
        # do job (que é "vectora") porque o script fica um nível acima.
        working-directory: .
        # build-hybrid.py espera "--jobs N" como dois argv separados
        # (sys.argv.index("--jobs")+1) — "--jobs=4" não bate no parser.
        run: python build-hybrid.py --jobs 4
        shell: bash
      - name: Smoke test (license bypass)
        env:
          VECTORA_LICENSE_BYPASS: "1"
        working-directory: .
        run: ./dist/vectora/vectora --version || ./dist/vectora/vectora.exe --version
        shell: bash
      - name: Smoke test (server actually boots inside the frozen binary)
        # --version só confirma que o processo abre e fecha; isto sobe o
        # backend de verdade (`vectora web`, dentro do binário Nuitka+
        # PyInstaller, não source interpretado) e confirma que /health
        # responde -- rotas montadas, settings carregadas, storage ok.
        working-directory: .
        run: uv run --project vectora scons smoke
        shell: bash
      - name: Build headless CLI binary (vectora-cli, linux/x64 only)
        # Base pro binário que a Vectora Bot Action roda em runners de CI —
        # reusa o MESMO backend.pyd já compilado pelo Nuitka acima (build
        # hybrid), só um passo extra de PyInstaller sem Electron/chat_static.
        # Só linux/x64 porque é o único alvo que um runner comum do GHA usa.
        if: matrix.target == 'linux'
        working-directory: .
        env:
          VECTORA_BUILD_CLI: "1"
        run: python build-hybrid.py --jobs 4
        shell: bash
      - name: Upload vectora-cli artifact
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v7
        with:
          # Nome fora do padrão "vectora-*" DE PROPÓSITO -- publish-update-channel
          # (abaixo) baixa artifacts com `pattern: vectora-*` esperando só
          # instaladores desktop; "vectora-cli-..." cairia nesse glob e
          # contaminaria dist-electron-all/services/release.ts.
          name: gha-bot-cli-linux-x64
          path: dist/vectora-cli/
          if-no-files-found: error
          retention-days: 30
      - name: Export Windows signing cert
        # electron-builder só pula a assinatura quando CSC_LINK está
        # ausente (undefined) — setado como string vazia ainda conta
        # como "certificado fornecido" e quebra o keychain no mac/linux.
        # $GITHUB_ENV só é escrito neste step (matrix.target == 'win'),
        # deixando a var genuinamente ausente nos outros SOs.
        if: matrix.target == 'win'
        shell: bash
        run: |
          echo "CSC_LINK=${{ secrets.WIN_CERTIFICATE_BASE64 }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Verifica sincronia de versão (pyproject.toml vs frontend/package.json)
        # release-please só bumpa vectora/pyproject.toml por padrão --
        # frontend/package.json precisa ser sincronizado via extra-files em
        # release-please-config.json. Sem essa sincronia, electron-builder
        # nomeia o instalador e grava o latest.yml com a versão ERRADA
        # (herdada do package.json desatualizado) -- o R2/KV publicam sob o
        # path de versão certo, mas o CONTEÚDO fica mentindo a versão, e o
        # electron-updater recusa a atualização como "downgrade". Falhar
        # aqui, cedo, é mais barato que descobrir isso em produção.
        working-directory: .
        shell: bash
        run: |
          pyproject_version=$(grep -m1 '^version = ' vectora/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          frontend_version=$(node -p "require('./vectora/frontend/package.json').version")
          if [ "$pyproject_version" != "$frontend_version" ]; then
            echo "::error::Versão divergente: pyproject.toml=$pyproject_version frontend/package.json=$frontend_version -- corrija release-please-config.json (extra-files) antes de publicar."
            exit 1
          fi
      - name: Build desktop shell + installer
        # Sem working-directory explícito: herda o default do job/workflow
        # (working-directory: vectora, linha 27-29) — por isso --dir aqui é
        # relativo a vectora/, não à raiz do monorepo (--dir vectora/frontend
        # duplicava o segmento e quebrava com ENOENT em .../vectora/vectora/...).
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.VECTORA_RELEASES_TOKEN }}
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run electron:build
          pnpm --dir frontend exec electron-builder --config electron/electron-builder.yml --${{ matrix.target }} --publish always
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: vectora-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            vectora/frontend/dist-electron/*.exe
            vectora/frontend/dist-electron/*.msi
            vectora/frontend/dist-electron/*.dmg
            vectora/frontend/dist-electron/*.AppImage
            vectora/frontend/dist-electron/*.deb
            vectora/frontend/dist-electron/*.rpm
            vectora/frontend/dist-electron/latest*.yml
            vectora/frontend/dist-electron/*.blockmap
          if-no-files-found: warn
          retention-days: 30

  # ── 6. Publish to update channel (R2 + KV) ───────────────────────────────
  # Roda uma única vez, depois que TODA a matriz (linux/mac/win) terminou —
  # publicar de dentro de cada job da matriz faria read-modify-write
  # concorrentes na mesma chave `config` do KV
  # (services/scripts/release.ts::publishVersionAndPrune), corrompendo o
  # rollout_percent/previous_stable/history por race condition.
  publish-update-channel:
    name: Publish to update channel (R2 + KV)
    needs: release-native
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master') ||
      (github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/publish-edge-production')
    runs-on: ubuntu-latest
    concurrency:
      group: vectora-production-update-channel
      cancel-in-progress: false
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # As credenciais R2 e do Wrangler ficam limitadas ao passo de publicação.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Read version from pyproject.toml
        # Fonte única do semver (mesmo arquivo que backend/version.py lê via
        # importlib.metadata) — sem tag pra extrair a versão, lemos direto.
        # working-directory: . sobrescreve o default do job (que é "vectora")
        # — sem isso "vectora/pyproject.toml" resolveria pra
        # vectora/vectora/pyproject.toml, inexistente.
        id: version
        working-directory: .
        run: |
          VERSION=$(grep -m1 '^version' vectora/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          pattern: vectora-*
          path: dist-electron-all
          merge-multiple: true
      - name: Install services deps
        working-directory: services
        run: pnpm install --frozen-lockfile
      - name: Publish (R2 + KV)
        # Sem CLOUDFLARE_API_TOKEN (wrangler/KV) ou sem as credenciais R2
        # (upload S3) o script falha na autenticação — o job fica vermelho
        # de propósito, nunca um no-op silencioso.
        working-directory: services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pnpm run release -- --version=${{ steps.version.outputs.value }} --dist="$GITHUB_WORKSPACE/dist-electron-all"

  # ── 7. Publish gha-bot CLI binary (R2) ────────────────────────────────────
  # Prefixo R2 separado (gha-bot/) do canal de update do desktop — não passa
  # por services/scripts/release.ts (schema por os/arch/canal, feito só pros
  # instaladores) nem pelo KV de rollout, é só um tarball versionado servido
  # via GET /gha-bot/download/:version (services/src/gha-bot/routes.ts).
  publish-gha-bot-cli:
    name: Publish gha-bot CLI binary (R2)
    needs: release-native
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master') ||
      (github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/publish-edge-production')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read version from pyproject.toml
        id: version
        working-directory: .
        run: |
          VERSION=$(grep -m1 '^version' vectora/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download vectora-cli artifact
        uses: actions/download-artifact@v8
        with:
          name: gha-bot-cli-linux-x64
          path: dist/vectora-cli
      - name: Tar + publish to R2 (multipart via S3-compatible API)
        working-directory: .
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # `wrangler r2 object put` (comando simples, sem multipart) rejeita
          # qualquer arquivo acima de 300 MiB — o vectora-cli chegou a 473 MiB
          # antes do enxugamento em build-hybrid.py (achado real: CI travado
          # com "Wrangler only supports uploading files up to 300 MiB"). `aws
          # s3 cp` contra o endpoint S3-compatível do R2 faz multipart
          # automático pra arquivos grandes, sem esse teto — usado aqui como
          # rede de segurança, independente de quão enxuto o binário fique.
          # Credenciais são as R2 API Tokens (Access Key ID/Secret), geradas
          # no dashboard Cloudflare em R2 > Manage API Tokens — DIFERENTES do
          # CLOUDFLARE_API_TOKEN usado pelo wrangler no resto do workflow.
          tar -czf vectora-cli-linux-x64.tar.gz -C dist/vectora-cli .
          aws s3 cp vectora-cli-linux-x64.tar.gz \
            "s3://vectora-r2/gha-bot/${{ steps.version.outputs.value }}/vectora-cli-linux-x64.tar.gz" \
            --endpoint-url "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"

  # ── 8. Publish edge production (docs + company + services) ──────────────
  # O workflow edge.yml é acionado por paths. Um release-please mergeia um
  # bump em vectora/, portanto não altera esses paths e não dispara a
  # publicação da borda. Este job mantém o release atômico: a mesma aprovação
  # que publica o Electron também compila e publica os três produtos usados
  # pelo ecossistema Vectora.
  publish-edge-production:
    name: Publish edge production (docs + company + services)
    needs: [test-unit, test-external, release-native]
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      needs.release-native.result == 'success') ||
      (github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.release-native.result == 'success') ||
      (github.event_name == 'push' &&
      ((github.ref == 'refs/heads/master' &&
      needs.test-unit.result == 'success' &&
      needs.test-external.result == 'success') ||
      (github.ref == 'refs/heads/publish-edge-production' &&
      needs.release-native.result == 'success'))))
    runs-on: ubuntu-latest
    concurrency:
      group: vectora-production-d1-schema
      cancel-in-progress: false
    environment: Production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.3"
          extended: true

      - name: Detect deployment credentials
        id: credentials
        shell: bash
        run: |
          echo "has_vercel_token=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_vercel_docs_project=${{ secrets.VERCEL_PROJECT_ID_DOCS != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_vercel_company_project=${{ secrets.VERCEL_PROJECT_ID_COMPANY != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_cloudflare_token=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Build company
        id: build_company
        if: always()
        working-directory: company
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Build docs
        id: build_docs
        if: ${{ !cancelled() }}
        working-directory: docs
        run: hugo --gc --minify
      - name: Validate and install services
        id: validate_services
        if: ${{ !cancelled() }}
        working-directory: services
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test

      - name: Deploy docs (Vercel)
        if: >-
          always() && steps.build_docs.outcome == 'success' &&
          steps.credentials.outputs.has_vercel_token == 'true' &&
          steps.credentials.outputs.has_vercel_docs_project == 'true'
        working-directory: docs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_DOCS: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
        run: pnpm dlx vercel --prod --yes --token="$VERCEL_TOKEN"
      - name: Deploy company (Vercel)
        if: >-
          always() && steps.build_company.outcome == 'success' &&
          steps.credentials.outputs.has_vercel_token == 'true' &&
          steps.credentials.outputs.has_vercel_company_project == 'true'
        working-directory: company
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_COMPANY: ${{ secrets.VERCEL_PROJECT_ID_COMPANY }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_COMPANY }}
        run: pnpm exec vercel --prod --yes --token="$VERCEL_TOKEN"
      - name: Apply base schema (D1)
        id: apply_base_schema
        if: >-
          always() && steps.validate_services.outcome == 'success' &&
          steps.credentials.outputs.has_cloudflare_token == 'true'
        working-directory: services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 execute vectora-db --remote --file=migrations/0001_schema.sql
      - name: Apply tracked migrations (D1)
        id: apply_d1_migrations
        if: >-
          always() && steps.apply_base_schema.outcome == 'success' &&
          steps.credentials.outputs.has_cloudflare_token == 'true'
        working-directory: services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply vectora-db --remote

      - name: Upgrade existing D1 schema (D1)
        id: upgrade_d1_schema
        if: >-
          always() && steps.apply_d1_migrations.outcome == 'success' &&
          steps.credentials.outputs.has_cloudflare_token == 'true'
        working-directory: services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          ensure_column() {
            local table="$1" column="$2" definition="$3"
            local schema
            schema=$(pnpm exec wrangler d1 execute vectora-db --remote \
              --command "PRAGMA table_info(${table})" --json)
            if ! grep -Eq "\\\"name\\\"[[:space:]]*:[[:space:]]*\\\"${column}\\\"" <<< "$schema"; then
              pnpm exec wrangler d1 execute vectora-db --remote \
                --command "ALTER TABLE ${table} ADD COLUMN ${column} ${definition}"
            fi
          }
          ensure_column gha_bot_config self_hosted_enabled "INTEGER NOT NULL DEFAULT 0"
          ensure_column issues github_repo "TEXT"
          ensure_column issues github_number "INTEGER"
          ensure_column issues github_url "TEXT"
          ensure_column issues github_sync_state "TEXT NOT NULL DEFAULT 'pending'"
          ensure_column issues github_sync_error "TEXT"
          ensure_column issues core_repo "TEXT"
          ensure_column issues core_number "INTEGER"
          ensure_column issues core_url "TEXT"
          ensure_column issues approved_at "TEXT"
          ensure_column issues approved_by "TEXT"
          ensure_column issues promotion_lease_until "TEXT"
          ensure_column issues response_version "INTEGER NOT NULL DEFAULT 0"
          ensure_column issues response_sync_lease_until "TEXT"
          ensure_column issue_comments updated_at "TEXT"
          ensure_column issue_comments deleted_at "TEXT"
          ensure_column github_webhook_deliveries attempt_token "TEXT"
          ensure_column github_webhook_deliveries lease_until "TEXT"
          ensure_column gha_bot_review_jobs callback_secret_hash "TEXT"
          pnpm exec wrangler d1 execute vectora-db --remote \
            --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_issues_github_identity ON issues(github_repo, github_number) WHERE github_repo IS NOT NULL AND github_number IS NOT NULL"
      - name: Deploy services (Workers)
        if: >-
          always() && steps.upgrade_d1_schema.outcome == 'success' &&
          steps.credentials.outputs.has_cloudflare_token == 'true'
        working-directory: services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
