name: VEXT SDK

on:
  push:
    paths: ["vext-sdk/**"]
  pull_request:
    paths: ["vext-sdk/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vext-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vext-sdk/package-lock.json
      - run: npm ci
      - run: npm run check

  publish:
    if: startsWith(github.ref, 'refs/tags/vext-sdk-') && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: vext-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --workspaces --if-present
