name: Migrate release-line pull requests

# A ativação da configuração é o limite para migrar pull requests existentes.
# Isso impede que o validador de milestones observe a política antiga enquanto
# a PR de configuração das linhas de release ainda aguarda merge.
on:
  pull_request_target:
    types: [closed]
    branches:
      - master

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  migrate:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'chore/rotate-release-lines-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          ROTATION_BODY: ${{ github.event.pull_request.body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.ROTATION_BODY ?? "";
            const metadata = body.match(
              /<!-- rotation: previous_maintenance_branch=([^;]+); previous_maintenance_milestone=([^;]+); previous_development_milestone=([^ ]+) -->/,
            );
            if (!metadata) {
              core.setFailed("A PR de rotação mesclada não possui metadados de migração validados.");
              return;
            }
            const [
              , previousMaintenanceBranch,
              previousMaintenanceMilestone,
              previousDevelopmentMilestone,
            ] = metadata;
            const { owner, repo } = context.repo;
            const config = JSON.parse(
              require("fs").readFileSync(".github/release-lines.json", "utf8"),
            );
            const { classifyPullRequest } = require(
              "./.github/scripts/migrate_release_line_prs.js",
            );
            const milestones = await github.paginate(
              github.rest.issues.listMilestones,
              { owner, repo, state: "open", per_page: 100 },
            );
            const maintenance = milestones.find(
              ({ title }) => title === config.maintenance.milestone,
            );
            const development = milestones.find(
              ({ title }) => title === config.development.milestone,
            );
            if (!maintenance || !development) {
              core.setFailed("As milestones ativas de release estão ausentes após a rotação.");
              return;
            }
            const prs = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "open", per_page: 100 },
            );
            for (const pr of prs) {
              const migration = classifyPullRequest(pr, config, {
                maintenanceBranch: previousMaintenanceBranch,
                maintenanceMilestone: previousMaintenanceMilestone,
                developmentMilestone: previousDevelopmentMilestone,
              });
              if (!migration) continue;
              if (pr.base.ref !== migration.base) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  base: migration.base,
                });
              }
              const target = migration.milestone === config.maintenance.milestone
                ? maintenance
                : development;
              if (pr.milestone?.number !== target.number) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: pr.number,
                  milestone: target.number,
                });
              }
              core.info(`PR #${pr.number} migrada.`);
            }
