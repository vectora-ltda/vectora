name: Edge (company + services + docs)

# Pipeline separado do app Vectora (.github/workflows/vectora.yml, que agora
# só dispara em mudanças de vectora/**) — cobre a borda web/edge do monorepo:
# company (site + dashboard, Vercel), docs (Hugo, Vercel) e services (Worker
# Cloudflare único: gateway + updates). Ciclo de vida próprio, não roda junto
# do app. O job `deploy` publica em produção automaticamente em todo push em
# master que toque um desses caminhos — espelha exatamente o que
# `scons prod` faz localmente (SConstruct::_action_prod), sem gate manual:
# aprovar/mesclar o PR já publica.

on:
  push:
    branches: [master]
    paths:
      - "company/**"
      - "services/**"
      - "docs/**"
      - ".github/workflows/edge.yml"
  pull_request:
    branches: [master]
    paths:
      - "company/**"
      - "services/**"
      - "docs/**"
      - ".github/workflows/edge.yml"
  workflow_dispatch:

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "11.5.0"

jobs:
  # ── Company (site + dashboard) ──────────────────────────────────────────
  company:
    name: Company (lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install deps
        working-directory: company
        run: pnpm install --frozen-lockfile
      - name: Lint (oxlint)
        working-directory: company
        run: pnpm run lint
      - name: Type check (paraglide + routes + tsc)
        working-directory: company
        run: pnpm run typecheck
      - name: Unit tests (vitest)
        working-directory: company
        run: pnpm run test

  # ── Services (Worker Cloudflare único: gateway + updates) ───────────────
  services:
    name: Services (types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install deps
        working-directory: services
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: services
        run: pnpm run typecheck
      - name: Unit tests (vitest)
        working-directory: services
        run: pnpm run test

  # ── Docs (Hugo) ───────────────────────────────────────────────────────────
  docs:
    name: Docs (Hugo build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # Mesma versão pinada em docs/vercel.json — build de verificação aqui
      # precisa refletir o que o Vercel realmente compila em produção.
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.3"
          extended: true
      - name: Build (verifica que o site compila)
        working-directory: docs
        run: hugo --gc --minify

  # ── Deploy de produção ───────────────────────────────────────────────────
  # Espelha SConstruct::_action_prod: docs + company (Vercel) e services
  # (D1 migrations + Worker) — nessa ordem, migrations sempre antes do
  # deploy do Worker (código novo pode assumir schema novo). Cada passo é
  # pulado (não falha) se o secret correspondente não estiver configurado —
  # mesma política já documentada em .env.gha.example.
  deploy:
    name: Deploy produção (Vercel + Cloudflare)
    runs-on: ubuntu-latest
    needs: [company, services, docs]
    # !cancelled(): sem uma função de status aqui, o GitHub Actions pula o
    # job INTEIRO se qualquer um dos `needs` falhar — os always() dos passos
    # abaixo nunca chegariam a rodar (achado do CodeRabbit, PR #22). Só
    # cancelamento explícito do workflow deve impedir o deploy de tentar.
    #
    # event_name aceita 'push' (automático, todo merge em master) E
    # 'workflow_dispatch' (retry manual pela aba Actions — ex.: publicação
    # anterior falhou por causa externa ao código, tipo bloqueio de
    # verificação de autor de commit da Vercel, e o usuário quer re-tentar
    # sem precisar de um push novo). github.ref continua travado em master
    # nos dois casos — workflow_dispatch permite escolher a branch na UI,
    # e sem essa checagem um disparo manual de outra branch publicaria em
    # produção por engano.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    # Secrets de produção vivem só no Environment "Production" (não em
    # repo-level Secrets) — sem declarar `environment:` aqui, o job não
    # enxerga nenhum deles (ficam vazios em silêncio, sem erro). Um único
    # environment pra tudo: nada de docs-production/services-production
    # separados, é a mesma "borda" (docs+company+services) publicando
    # junto, como scons prod já faz localmente.
    environment: Production
    concurrency:
      group: vectora-production-d1-schema
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_DOCS: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
      VERCEL_PROJECT_ID_COMPANY: ${{ secrets.VERCEL_PROJECT_ID_COMPANY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Detect deployment credentials
        id: credentials
        shell: bash
        run: |
          echo "has_vercel_token=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_cloudflare_token=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Install company deploy tooling
        if: steps.credentials.outputs.has_vercel_token == 'true'
        working-directory: company
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `always() &&` + `needs.<job>.result == 'success'` em todos os passos
      # daqui pra baixo: cada deploy (docs/company/services) é independente
      # dos outros (a falha de UM não deve impedir os outros de tentar —
      # ex. docs quebrando por um problema do Hugo Modules no Vercel não
      # deveria travar o deploy de services/), MAS só roda se a validação
      # do PRÓPRIO projeto passou de verdade — `always()` sozinho (sem o
      # `needs.*.result`) rodaria o deploy mesmo com lint/tests/build
      # falhando (achado do CodeRabbit, PR #22).
      - name: Deploy docs (Vercel)
        if: >-
          always() && needs.docs.result == 'success' &&
          steps.credentials.outputs.has_vercel_token == 'true' &&
          env.VERCEL_PROJECT_ID_DOCS != ''
        working-directory: docs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_DOCS }}
        run: pnpm dlx vercel --prod --yes --token="$VERCEL_TOKEN"

      - name: Deploy company (Vercel)
        if: >-
          always() && needs.company.result == 'success' &&
          steps.credentials.outputs.has_vercel_token == 'true' &&
          env.VERCEL_PROJECT_ID_COMPANY != ''
        working-directory: company
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_COMPANY }}
        run: pnpm exec vercel --prod --yes --token="$VERCEL_TOKEN"

      # id em cada passo de services/: terceiro achado do CodeRabbit (PR #22)
      # — needs.services.result só garante que a VALIDAÇÃO (job `services`,
      # outro runner) passou; não impede que "Install deps" FALHE aqui
      # dentro do próprio job `deploy` (ex. flake de rede) e ainda assim
      # `always()` deixe migrations/deploy rodarem sem node_modules.
      # steps.<id>.outcome encadeia a dependência real dentro do job.
      - name: Install deps (services)
        id: services_install
        if: >-
          always() && needs.services.result == 'success' &&
          steps.credentials.outputs.has_cloudflare_token == 'true'
        working-directory: services
        run: pnpm install --frozen-lockfile

      # Migrations ANTES do deploy do worker: o código deployado assume o
      # schema mais novo — publicar sem aplicar quebra rotas em produção.
      #
      # `0001_schema.sql` fica FORA do rastreamento de `d1 migrations apply`
      # de propósito (arquivo único idempotente, reaplicado por completo a
      # cada mudança de schema — ver o cabeçalho do próprio arquivo). Sem
      # reaplicá-lo aqui, uma tabela nova adicionada só nesse arquivo nunca
      # chega em produção, e a primeira migration numerada que depender dela
      # falha com "no such table". Reaplicar é seguro (só `CREATE TABLE/INDEX
      # IF NOT EXISTS`).
      - name: Aplica schema base D1 (services)
        id: services_schema
        if: >-
          always() && steps.services_install.outcome == 'success' &&
          steps.credentials.outputs.has_cloudflare_token == 'true'
        working-directory: services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 execute vectora-db --remote --file=migrations/0001_schema.sql

      # O schema base é deliberadamente um único arquivo idempotente e não é
      # reaplicado pelo rastreador de migrations. Faça aqui o upgrade aditivo
      # para bancos criados antes de self_hosted_enabled existir.
      - name: Atualiza colunas legadas D1 (services)
        id: services_schema_upgrade
        if: >-
          always() && steps.services_schema.outcome == 'success' &&
          steps.credentials.outputs.has_cloudflare_token == 'true'
        working-directory: services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          ensure_column() {
            local table="$1" column="$2" definition="$3"
            local schema
            schema=$(pnpm exec wrangler d1 execute vectora-db --remote \
              --command "PRAGMA table_info(${table})" --json)
            if ! grep -Eq "\\\"name\\\"[[:space:]]*:[[:space:]]*\\\"${column}\\\"" <<< "$schema"; then
              pnpm exec wrangler d1 execute vectora-db --remote \
                --command "ALTER TABLE ${table} ADD COLUMN ${column} ${definition}"
            fi
          }
          ensure_column gha_bot_config self_hosted_enabled "INTEGER NOT NULL DEFAULT 0"
          ensure_column issues github_repo "TEXT"
          ensure_column issues github_number "INTEGER"
          ensure_column issues github_url "TEXT"
          ensure_column issues github_sync_state "TEXT NOT NULL DEFAULT 'pending'"
          ensure_column issues github_sync_error "TEXT"
          ensure_column issues core_repo "TEXT"
          ensure_column issues core_number "INTEGER"
          ensure_column issues core_url "TEXT"
          ensure_column issues approved_at "TEXT"
          ensure_column issues approved_by "TEXT"
          ensure_column issue_comments updated_at "TEXT"
          ensure_column issue_comments deleted_at "TEXT"
          ensure_column gha_bot_review_jobs callback_secret_hash "TEXT"

      - name: Aplica migrations D1 (services)
        id: services_migrations
        if: >-
          always() && steps.services_schema_upgrade.outcome == 'success' &&
          steps.credentials.outputs.has_cloudflare_token == 'true'
        working-directory: services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply vectora-db --remote

      - name: Deploy services (Worker Cloudflare)
        if: >-
          always() && steps.services_migrations.outcome == 'success' &&
          steps.credentials.outputs.has_cloudflare_token == 'true'
        working-directory: services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

      - name: Resumo
        if: always()
        run: |
          echo "## Deploy de produção" >> "$GITHUB_STEP_SUMMARY"
          echo "- docs.vectora.company + vectora.company (Vercel)" >> "$GITHUB_STEP_SUMMARY"
          echo "- services (Cloudflare Worker)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Passos sem secret configurado foram pulados — ver .env.gha.example." >> "$GITHUB_STEP_SUMMARY"
