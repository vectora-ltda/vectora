name: VEXT SDK

on:
  push:
    paths:
      - "vext-sdk/**"
      - ".github/workflows/vext-sdk.yml"
  pull_request:
    paths:
      - "vext-sdk/**"
      - ".github/workflows/vext-sdk.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: vext-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vext-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vext-sdk/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run

  publish:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: vext-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
