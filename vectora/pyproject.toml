[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectora"
version = "0.1.16"
description = "Vectora - Advanced AI Assistant"
readme = "README.md"
authors = [{name = "Vectora Ltda", email = "contato@vectora.company"}]
requires-python = ">=3.13"
# `Private :: Do Not Upload` impede `twine upload`/`uv publish` acidental.
classifiers = [
    "Private :: Do Not Upload",
]

dependencies = [
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "aiosqlite>=0.22.1",
    "lancedb>=0.37.1",
    "pyarrow>=24.0.0",
    "sqlalchemy>=2.0.51",
    "mcp>=1.29.0",
    # mcp.cli.cli importa typer incondicionalmente — não é dependência
    # opcional de fato apesar do extra "cli" do pacote; sem isso o build
    # nativo (PyInstaller collect_all('mcp')) quebra com ModuleNotFoundError.
    "typer>=0.15.0",
    "rich>=15.0.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.2.2",
    "pathspec>=1.1.1",
    "watchdog>=6.0.0",
    "tiktoken>=0.13.0",
    "ruff>=0.15.18",
    "pytest>=9.1.1",
    "ty>=0.0.51",
    "pandas>=3.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.14.2",
    "pytest-order>=1.5.0",
    "pytest-rerunfailures>=16.3",
    "pytest-timeout>=2.4.0",
    "mypy>=2.1.0",
    "bandit>=1.9.4",
    "types-python-dateutil>=2.9.0.20260518",
    "pyright>=1.1.410",
    "argon2-cffi>=25.1.0",
    "pynacl>=1.6.2",
    "slowapi>=0.1.10",
    "keyring>=25.7.0",
    "pykeepass>=4.1.1",
    "gitpython>=3.1.50",
    "httpx>=0.28.1",
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
    "ptyprocess>=0.7 ; sys_platform != 'win32'",
    "pyseccomp>=0.1.2 ; sys_platform == 'linux'",
    "asyncssh>=2.23.1",
    "nuitka[all]>=4.1.2",
    "scons>=4.10.1",
    "send2trash>=2.1.0",
    "pystray>=0.19.5",
    "pillow>=12.2.0",
    "pyautogui-next>=0.9.55",
    "redis[hiredis]>=7.4.1",
    "asyncpg>=0.31.0",
    "qdrant-client>=1.18.0",
    # SDKs oficiais usados direto por backend/tools/media.py (geração de
    # imagem/áudio) e backend/llm/transcription.py.
    "openai>=2.52.0",
    "google-genai>=2.16.0",
    "fakeredis>=2.36.2",
    "pyjwt>=2.13.0",
    "croniter>=6.2.2",
    "psycopg[binary]>=3.3.4",
    "networkx>=3.4",
    "numpy>=1.21",
    "rapidfuzz>=3.0",
    "tree-sitter>=0.23.0,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.25",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-rust>=0.23,<0.25",
    "tree-sitter-java>=0.23,<0.25",
    "tree-sitter-c>=0.23,<0.25",
    "tree-sitter-cpp>=0.23,<0.25",
    "tree-sitter-json>=0.23,<0.26",
    "playwright>=1.50.0",
    "nats-py>=2.9.0",
    # Vectora Connect — SDKs oficiais das plataformas de mensageria. Email usa
    # imaplib/smtplib da stdlib, sem dependência.
    "python-telegram-bot>=22.8",
    "discord.py>=2.7.1",
    "slack-bolt>=1.30.0",
    "tree-sitter-language-pack>=1.14,<2",
    # Parsers de documento reais para `ingest_docs`/`context_graph/detect.py`
    # (antes só existiam atrás de `try/except ImportError` — nunca rodavam
    # em nenhuma instalação real, PDF/DOCX/XLSX viravam lixo binário no RAG).
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    # YouTube/outras plataformas (backend/tools/youtube.py) — captions
    # públicas primeiro (sem baixar mídia nenhuma), yt-dlp só como
    # fallback (áudio, sem captions) ou pra extrair um frame sob demanda.
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.3.17",
]

[project.optional-dependencies]
# Transcrição local (`backend/tools/media_native.py::transcribe_local`) —
# CTranslate2 (~150MB de modelo baixado sob demanda na primeira chamada,
# cacheado em ~/.vectora/models/whisper/) não deve inflar o install padrão
# de quem nunca usa transcrição 100% offline. `uv sync --extra media`.
media = [
    "faster-whisper>=1.2.1",
]

[project.scripts]
vectora = "backend.main:run"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
exclude = ["chat"]

[tool.hatch.build.targets.sdist]
exclude = ["chat"]

[tool.hatch.build.targets.wheel.force-include]
"backend/defaults.env" = "backend/defaults.env"
"backend/assets" = "backend/assets"

[tool.ruff]
line-length = 88
target-version = "py313"
fix = true
show-fixes = true
indent-width = 4
exclude = [
    ".venv", "data", "logs", "chrome-devtools-mcp-main", "hermes-agent",
    "paperclip-master", ".claude/worktrees", "node_modules", "dist", "build",
    "coverage", "__pycache__",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "T201", "COM812", "INP001", "D", "ANN401", "ERA001", "PLW0603",
    "RUF012", "G202", "TRY300", "TRY301", "SIM117", "SIM102", "ARG001",
    "ARG002", "BLE001", "RUF001", "PGH003", "SLF001", "S110", "PLR2004",
    "E501", "PD011", "DTZ005", "TRY004", "PLC0415", "F841", "ASYNC240",
    "F401", "PT011", "PT017", "FBT001", "G004", "TRY401", "TRY002",
    "ARG005", "C901", "A004", "ASYNC230", "PLR0913", "E402",
    # Exception message style — too strict for this codebase
    "TRY003", "EM101", "EM102",
    # TODO comment formatting — subjective style rules
    "TD002", "TD003", "TD004", "FIX002",
    # Boolean args are acceptable in internal Python APIs
    "FBT002", "FBT003",
    # PLR complexity — chat_loop and commands are intentionally large
    "PLR0912", "PLR0915",
    # ANN for __init__ return type — implied None, not needed
    "ANN204",
    # TC: moving imports to TYPE_CHECKING blocks requires from __future__ import annotations
    # which can break runtime type inspection in Pydantic
    "TC001", "TC002", "TC003",
    # O repositório não exige cabeçalho de copyright em cada módulo.
    "CPY001",
    # APIs de integração e parsers mantêm assinaturas amplas por compatibilidade.
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Tests usam credenciais fake (S105/6/7), asserts compostos (PT018), fixtures
# sem valor (PT019), *args sem anotação (ANN002) e fakes que retornam self em
# __aenter__ (PYI034) — todos idiomáticos em suíte de testes.
"tests/**/*.py" = ["ANN201", "ANN001", "ANN202", "ANN003", "ANN002", "ARG001", "ARG002", "S101", "S105", "S106", "S107", "S108", "N806", "RUF003", "PT018", "PT019", "PYI034"]
"tests/e2e/**/*.py" = ["S603", "S607", "PLW1510"]
"tests/integration/**/*.py" = ["S603", "PLW1510"]
"check_coverage.py" = ["S603", "PLW1510", "PLW2901", "B007"]
"run_coverage.py" = ["S603", "PLW1510", "RUF005"]
"backend/tools/*.py" = ["PLR0911", "S602"]
# context_graph: código portado do graphify (MIT) — usa convenção networkx (G maiúsculo),
# tem código XML real (S314), hashes do graphify (S324), e anotações incompletas herdadas.
"backend/context_graph/*.py" = [
    "N803", "N806",           # G é convenção networkx para grafos
    "ANN001", "ANN002", "ANN003", "ANN202",  # anotações em código portado
    "B023",                   # loop variable binding — padrão em closures networkx
    "PERF401",                # list comprehensions — estilo do graphify
    "PLR0911",                # muitos returns — algoritmos de grafo complexos
    "PLW2901",                # redefined loop var — idiomático no código
    "S314",                   # XML (ET.parse) — lê manifests de pacote controlados
    "S324",                   # sha1/md5 — minhash usa sha1 por velocidade, não segurança
    "S603", "S607", "S310",   # subprocess/URL — graphify itera executáveis externos
    "E701",                   # múltiplos statements por linha — estilo do código portado
    "E741",                   # nomes ambíguos (l, O, I) — variáveis de grafo
    "PTH105", "PTH108", "PTH114", "PTH117", "PTH119", "PTH120", "PTH123",  # os.path vs pathlib
    "PLW0602",                # global sem assign — padrão de singletons
    "PLW1510",                # subprocess sem check= — código portado
    "DTZ011",                 # date.today() sem tz — backup timestamp
    "B904",                   # raise from — código portado
    "B007",                   # loop var não usado — idiomático
    "B005",                   # .strip() com multi-char — intencional
    "SIM105",                 # use contextlib.suppress — estilo explícito preferido
    "RUF002", "RUF003",       # comentários com caracteres Unicode (fórmulas matemáticas)
    "PLC0206",                # dict.items() — estilo do código
    "PERF402",                # list copy — código portado
    "ICN001",                 # import convention — graphify usa convenções próprias
    "F402",                   # import shadowing — código portado
    "S112",                   # use continue — estilo do código portado
]
"backend/agents/*.py" = ["PLR0911"]
"backend/nodes/engine.py" = ["E501"]
"backend/nodes/base.py" = ["PLR0911"]
"backend/persistence/checkpoint.py" = ["N802"]
# Fake ctypes.WinDLL — nomes espelham a API Win32 real (CreateJobObjectW etc).
"tests/unit/test_sandbox_windows.py" = ["N802"]
# Wizards interativos de CLI: getpass/input() bloqueante é o comportamento
# correto (nada mais roda no loop durante o prompt). S603 cobre o teste de
# conexão que carrega o LLM; RUF006 o create_task do streaming de status.
"backend/cli/keys.py" = ["S603", "RUF006", "ASYNC250"]
"backend/cli/storage.py" = ["ASYNC250"]
# Nomes de tabela vêm de _SQLITE_TABLES hardcoded (não user input); asserts de
# narrowing de tipo em script de migração. SIM118/SIM401: as linhas operam
# sobre sqlite3.Row (não dict) — `.keys()` é obrigatório e `.get()` não existe.
"backend/storage/migrations/data_migration.py" = ["S608", "S101", "SIM118", "SIM401"]
# get_text_at_path: parser recursivo de dot-path (token de path, não segredo —
# S105 é falso positivo do nome da variável); muitos returns é inerente a um
# parser de sintaxe com vários formatos de token (campo/índice/wildcard/seleção).
"backend/persistence/native/store.py" = ["S105", "PLR0911"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ─── ty (Astral type checker) ──────────────────────────────────────────────────
[tool.ty.src]
exclude = ["backend/mcp/server.py", "tests/fixtures/dummy_mcp_server.py"]

[[tool.ty.overrides]]
# landlock.py/rlimits.py: os.O_CLOEXEC/resource.setrlimit só existem nos stubs
# POSIX — `ty` resolve por plataforma do host rodando a checagem, então um
# `ty: ignore` inline fica "usado" no Windows (dev) e "não usado" no Linux
# (CI, ubuntu-latest) ao mesmo tempo, sem comentário que sirva pros dois. O
# módulo é Linux-only por natureza (bwrap/Landlock não existem fora disso —
# ver docstring de linux.py), então a supressão é honesta aqui, não workaround.
include = ["backend/sandbox/landlock.py", "backend/sandbox/rlimits.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
# extract.py: 8500+ linhas de parsers tree-sitter com imports opcionais (try/except).
# Os módulos tree_sitter_* não estão nas deps do projeto — são extras opcionais.
# Os atributos .type/.children são da API dinâmica do tree-sitter (sem stubs py.typed).
include = ["backend/context_graph/extract.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
invalid-assignment = "ignore"

[[tool.ty.overrides]]
# cluster.py: graspologic é opcional (fallback para networkx louvain).
# dedup.py: usa load_llm via asyncio.get_event_loop() em contexto sync.
include = [
    "backend/context_graph/cluster.py",
    "backend/context_graph/dedup.py",
    "backend/context_graph/export.py",
    "backend/context_graph/analyze.py",
    "backend/context_graph/build.py",
    "backend/context_graph/cache.py",
    "backend/context_graph/detect.py",
    "backend/context_graph/manifest_ingest.py",
    "backend/context_graph/multigraph_compat.py",
    "backend/context_graph/symbol_resolution.py",
    "backend/context_graph/paths.py",
    "backend/context_graph/report.py",
    "backend/context_graph/security.py",
    "backend/context_graph/graph_index.py",
    "backend/context_graph/query.py",
    "backend/context_graph/affected.py",
    "backend/context_graph/semantic_cleanup.py",
    "backend/context_graph/pipeline.py",
    "backend/context_graph/validate.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
invalid-assignment = "ignore"
missing-argument = "ignore"
unsupported-operator = "ignore"

[tool.bandit]
exclude_dirs = ["tests", "check_coverage.py", "run_coverage.py"]
skips = ["B110", "B101"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
# Backend roda em Windows (desktop) e Linux (VPS/docker) — sem isso, o Pyright
# infere a plataforma do host de análise e marca ramos `sys.platform=="..."`
# do outro SO como código morto (falso positivo em código genuinamente
# multi-plataforma, ex.: _list_drives() em handlers/workspaces.py).
pythonPlatform = "All"
include = ["backend", "tests"]
exclude = ["**/venv", "**/.venv", "**/env", "**/.env", "**/node_modules", "**/__pycache__"]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "vectora" }]

[tool.pytest.ini_options]
addopts = "--color=yes --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 300  # ver comentário abaixo — 120s comprovadamente insuficiente na CI
# Hang intermitente confirmado só na CI (ubuntu-latest, nunca reproduzido
# local em várias rodadas completas da suíte, incl. com --cov ligado).
# Causa raiz identificada: a primeira chamada real (não mockada) a
# `lancedb.connect_async()` numa sessão de testes trava de forma
# determinística no Linux — dump de threads mostra o runtime Tokio nativo
# do LanceDB (`lancedb-tokio-w`) e o event loop do próprio teste ambos
# ociosos (`futex_do_wait`/`ep_poll`), ou seja, ninguém processando nada.
# Reproduzido em lancedb 0.36.0 E 0.37.1 — não é bug de versão. Isolar via
# `pytest-forked` (fork) NÃO funciona: o runtime nativo do LanceDB tem
# threads em background (jemalloc, Tokio) que um `fork()` clássico não
# duplica de forma segura — resulta em segfault no processo filho em vez
# de hang. Os testes que tocam LanceDB de verdade (marcador
# `real_lancedb`) são isolados num STEP SEPARADO do workflow de CI
# (subprocesso real do SO, não fork — ver .github/workflows/vectora.yml),
# com timeout próprio que nunca bloqueia o job principal. `timeout_method
# =thread` mata o processo inteiro (`os._exit`) no timeout — reruns/flaky
# não ajudam aqui. 300s dá margem para o resto da suíte.
# "signal" (default) só despeja a stack da thread principal no timeout — não
# mostra onde a thread de background do portal anyio/starlette (usada por
# TestClient) está de fato presa, que é exatamente onde os hangs de CI
# acontecem. "thread" despeja TODAS as threads (faulthandler.dump_traceback
# com all_threads=True), a única forma de ver a causa real de um hang em vez
# de só "algo travou em algum lugar".
timeout_method = "thread"
filterwarnings = [
    # ── Deprecações de libs externas que não controlamos ──────────────────────
    # FastAPI/Starlette TestClient ainda usa httpx clássico (será httpx2).
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:Warning",
    # google-genai herda de aiohttp.ClientSession (apenas "discouraged").
    "ignore:Inheritance class AiohttpClientSession from ClientSession is discouraged:DeprecationWarning",
    # ── Ruído de teardown de testes (não é bug do produto) ────────────────────
    # aiosqlite fecha sua thread worker após o event loop do teste encerrar;
    # a exceção "Event loop is closed" é capturada pelo pytest como warning.
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    # Windows ProactorEventLoop: __del__ de _ProactorBasePipeTransport/
    # BaseSubprocessTransport pode rodar durante o GC cíclico de um teste
    # totalmente diferente daquele que criou o transport (o fechamento
    # assíncrono via IOCP às vezes ainda não terminou quando o event loop do
    # teste original é destruído). O __repr__ do __del__ tenta ler
    # self._sock.fileno() e explode com "I/O operation on closed pipe" —
    # artefato de timing do CPython/Proactor no Windows, não bug do produto
    # nem do teste apontado (a atribuição de qual teste "causou" é aleatória).
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # Conexões sqlite efêmeras coletadas pelo GC durante os testes (mocks/pydantic).
    "ignore::ResourceWarning",
    # Coroutines criadas dentro de mocks/streams de teste que não são aguardadas.
    "ignore:coroutine .* was never awaited:RuntimeWarning",
    # QdrantClient avisa quando api_key é usado sem HTTPS — esperado em testes locais.
    "ignore:Api key is used with an insecure connection:UserWarning",
    # PyJWT avisa sobre chaves HMAC curtas em tokens de teste.
    "ignore:The HMAC key is.*bytes long.*below the minimum:Warning",
]
markers = [
    "e2e: testes end-to-end com APIs reais (requer env vars e gemini CLI)",
    "integration: testes de integração com APIs reais (requer GOOGLE_API_KEY + COHERE_API_KEY)",
    "lifecycle: testes de ciclo de vida sequenciais na session 1212",
    "stress: testes de carga e concorrência — sem APIs externas, apenas infra local",
    "storage: testes de integração de storage — Postgres, Redis, Qdrant, SQLite, LanceDB (sobe docker automaticamente)",
    "singularity: testes de escape real do sandbox Singularity/Apptainer — requer binário instalado, deselecionado por padrão no CI (roda local com 'singularity'/'apptainer' presentes)",
    "browser: testes que sobem Chromium real via Playwright — requer 'playwright install chromium'",
    "frontend_build: testes que sobem o backend real servindo frontend/dist — requer 'pnpm --dir frontend build'",
    "electron_dev: testes que sobem o Electron dev build real — requer 'scons frontend' (ou 'pnpm --dir vectora/frontend install && pnpm --dir vectora/frontend run electron:build')",
    "live: testes sem mock que chamam LLM/Tavily reais — custam API real, só via 'scons tests-live'",
    "real_lancedb: testes que chamam lancedb.connect_async() real (sem mock) — travam de forma determinística no Linux CI, rodam em step isolado do workflow (ver comentário do timeout acima)",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest-asyncio>=1.3.0",
]
