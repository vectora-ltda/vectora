# electron-builder config
#
# Gera instaladores nativos (Windows NSIS .exe + MSI, macOS .dmg/.zip e Linux
# AppImage, DEB, RPM, Pacman e Flatpak). A assinatura/notarização é configurada pelo workflow
# segundo as credenciais disponíveis. Cada instalador empacota a shell Electron
# + o binário Nuitka como extraResource.
#
# Pre-req:
# - Win: CSC_LINK + CSC_KEY_PASSWORD (certificado Authenticode confiável).
# - macOS: identidade Developer ID e credenciais Apple para notarização;
#   sem elas, assinatura ad-hoc e instruções de abertura manual.
# - Linux: SHA256SUMS e assinatura GPG destacada quando a chave estiver configurada.
#
# Publish: vectora-services (Cloudflare Worker + R2), não GitHub Releases — o
# Free precisa baixar e atualizar sem conta. `${os}`/`${arch}` resolvem por
# build (mesmo macro do
# artifactName), então cada instalador aponta pro seu próprio
# /updates/<channel>/<os>/<arch>/latest.yml no Worker remoto.

appId: company.vectora.desktop
productName: Vectora
copyright: Copyright © 2026 Vectora Company
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Toolset moderno de assinatura (electron-builder 26). O default (legacy/null)
# baixa o pacote monolítico `winCodeSign-2.6.0.7z`, que carrega symlinks de
# `darwin/.../*.dylib` (OpenSSL do macOS). No Windows sem Modo de Desenvolvedor
# nem admin, o 7za falha ao criar esses symlinks (`Cannot create symbolic link`)
# e o build inteiro aborta — mesmo num build NÃO-assinado. O toolset "1.1.0" usa
# bundles `.zip` modulares (windows-kits-bundle + rcedit-windows), todos só com
# binários Windows, sem nenhum symlink — extrai limpo sem privilégio especial.
toolsets:
  winCodeSign: "1.1.0"

# Esquema de deep-link vectora:// — antes vivia em package.json["build"], que o
# electron-builder IGNORA quando existe este .yml (config único). Movido p/ cá.
protocols:
  - name: Vectora
    schemes:
      - vectora

directories:
  output: dist-electron
  buildResources: electron/build-resources

# Config carregado com `--config electron/electron-builder.yml`, executado com
# cwd em frontend/ (pnpm --dir) — todo path relativo abaixo resolve
# contra frontend/, não contra a pasta deste arquivo.
files:
  - dist/**/*
  - electron/dist/**/*
  - package.json
  - "!node_modules/**/{CHANGELOG.md,README.md,*.d.ts,test,tests}"

# Backend híbrido (PyInstaller --onedir) como sidecar. build-hybrid.py Fase 2 gera
# a PASTA dist/vectora/ (vectora.exe + _internal/); copiamos ela inteira para
# resources/vectora-core/. onedir (sem compressão) é o que habilita o delta do
# electron-updater: arquivos não-alterados ficam byte-idênticos entre versões.
# O app spawna resources/vectora-core/vectora.exe (electron/src/main.ts).
#
# dist/vectora/ fica na raiz do repositório — projectDir aqui é frontend/
# (onde mora o package.json), um nível abaixo da raiz, daí o "..".
extraResources:
  # O backend sidecar lê as notas a partir do diretório do executável.
  - from: ../CHANGELOG.md
    to: vectora-core/CHANGELOG.md
  - from: ../dist/vectora
    to: vectora-core
  # Sidecar nats-server (fila/KV persistente): baixado por `scons nats` (dep do
  # release). O backend recebe o caminho via VECTORA_NATS_BINARY no spawn
  # (electron/src/main.ts). Glob cobre nats-server e nats-server.exe.
  - from: ../resources
    to: .
    filter:
      - nats-server*
  - from: public/favicon-32x32.png
    to: tray-icon.png
  - from: public/favicon-600x600.png
    to: vectora-icon.png
  - from: public/vectora.ico
    to: vectora.ico

# Janela de update aponta pro vectora-services público (sem token — Free
# não tem conta). ${os}/${arch} resolvem por build, batendo com a rota
# GET /updates/:channel/:os/:arch/latest.yml do worker.
publish:
  - provider: generic
    # O workflow define VECTORA_UPDATE_CHANNEL como `latest` para a linha
    # atual e `maintenance` para tags v0.1.x. O instalador continua na mesma
    # linha em que foi publicado. O worker e o publicador sempre usam o nome
    # latest.yml para o manifesto, independentemente do canal da URL.
    url: https://services.vectora.company/updates/${env.VECTORA_UPDATE_CHANNEL}/${os}/${arch}
    channel: latest

win:
  target:
    - nsis
    - msi
  icon: public/vectora.ico
  # Sem opções de assinatura fixas: o electron-builder assina automaticamente
  # quando CSC_LINK + CSC_KEY_PASSWORD estão no env (CI, cert EV em base64) e
  # gera build NÃO-assinado quando não estão (dev local). Fixar
  # certificateSubjectName forçava procurar o cert no Windows store e quebrava
  # o build local ("Cannot find certificate Vectora Company").

mac:
  target:
    - dmg
    - zip
  # electron-builder gera o .icns a partir de um .svg/.png — .ico não é
  # aceito nesse pipeline (icon-tool.js só lê .png/.svg/.icns).
  icon: public/vectora.svg
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  title: ${productName} ${version}
  # background omitido de propósito — usa o fundo padrão do electron-builder
  # (não há dmg-background.png em build-resources; sem isso o build falharia).
  iconSize: 96
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

linux:
  executableName: vectora
  syncDesktopName: true
  target:
    - AppImage
    - deb
    - rpm
    - snap
    - pacman
    - flatpak
    - tar.gz
  icon: electron/build-resources/linux-icons
  category: Development
  # Os PNGs em electron/build-resources/linux-icons são instalados sob hicolor/<tamanho>/apps;
  # Icon referencia o mesmo nome em todas as entradas .desktop geradas.
  desktop:
    entry:
      Name: Vectora
      StartupWMClass: vectora
      Icon: vectora
      GenericName: AI development assistant
      Categories: Development;IDE;
      Comment: Self-hosted AI-first development assistant
      Keywords: AI;development;coding;assistant;
      StartupNotify: true
  synopsis: Vectora - AI-first development assistant
  description: Self-hosted AI assistant with RAG, terminals, code editing and workflows.
  vendor: Vectora Company
  maintainer: Vectora Ltda <contato@vectora.company>

deb:
  depends:
    # Ubuntu 24.04+/Debian 13 renomearam algumas bibliotecas durante a
    # transição t64. As alternativas mantêm o mesmo pacote instalável também
    # em Debian 12/Ubuntu 22.04, que ainda usam os nomes antigos. O nome t64
    # vem primeiro: `libasound2` é virtual no Ubuntu 24.04 e o apt o resolve
    # por `liboss4-salsa-asound2`, que não exporta os símbolos reais do ALSA.
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libasound2t64 | libasound2
    - libuuid1
    - libsecret-1-0
    - libdrm2
    - libgbm1
  recommends:
    - libappindicator3-1 | libayatana-appindicator3-1
  priority: optional
  afterInstall: electron/build-resources/linux-after-install.sh
  afterRemove: electron/build-resources/linux-after-remove.sh

pacman:
  # Lista explícita: a padrão do electron-builder exige `http-parser`, que
  # saiu dos repositórios do Arch e impede a instalação do pacote.
  depends:
    - gtk3
    - nss
    - libnotify
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - alsa-lib
    - util-linux-libs
    - libsecret
    - libdrm
    - mesa

# A licença AGPL-3.0 fica na raiz do repositório, fora dos arquivos de licença
# que o electron-builder inclui automaticamente no AppImage. Não configurar
# `license:` para um caminho inexistente dentro de `frontend/`.
appImage: {}

flatpak:
  # O pacote é um bundle instalável localmente; publicação no Flathub exigiria
  # um repositório e revisão próprios, fora deste pipeline de downloads.
  runtime: org.freedesktop.Platform
  runtimeVersion: "24.08"
  sdk: org.freedesktop.Sdk

snapcraft:
  base: core22
  core22:
    confinement: strict

nsis:
  # ManifestDPIAware true vem de build-resources/installer.nsh (hook customHeader,
  # auto-incluído pelo electron-builder) — sem ele a fonte do instalador borra em HiDPI.
  oneClick: false
  perMachine: false
  # Mantém o instalador compatível com os blockmaps publicados no canal para
  # que electron-updater aplique deltas quando possível, em vez de baixar e
  # reconstruir todo o pacote a cada versão.
  differentialPackage: true
  allowToChangeInstallationDirectory: true
  installerIcon: public/vectora.ico
  uninstallerIcon: public/vectora.ico
  shortcutName: Vectora
  uninstallDisplayName: Vectora
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: Vectora
  # Suporte a instalação silenciosa: vectora-Setup-x.y.z.exe /S

# Auto-update channel name (alpha / beta / latest).
generateUpdatesFilesForAllChannels: true
