# Config só pra testes locais (vitest-plugin/miniflare) — nunca usado
# em deploy real (isso é `wrangler.toml`). Cópia de `wrangler.toml` com uma
# única diferença: `[[migrations]]` aqui só declara a classe atual, sem o
# histórico completo — miniflare valida localmente que toda `renamed_classes`
# tenha a classe de origem declarada numa migration anterior, checagem que
# não se aplica a um storage efêmero recriado a cada rodada de teste.
name = "vectora-services"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

[[routes]]
pattern = "*.vectora.chat/*"
zone_name = "vectora.chat"

[durable_objects]
bindings = [
  { name = "GATEWAY_SESSION", class_name = "GatewaySession" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewaySession"]

[[kv_namespaces]]
binding = "GATEWAY_METRICS"
id = "f38a1de6901643c89d02a69cd5b529e2"

[[r2_buckets]]
binding = "R2"
bucket_name = "vectora-r2"

[[kv_namespaces]]
binding = "KV"
id = "0bed7e9f6db54ff3bb8d04c015c7a0e2"

[[d1_databases]]
binding = "DB"
database_name = "vectora-db"
database_id = "fe18c73c-4af6-4200-ab5e-657fdfa423e9"
migrations_dir = "migrations"

[triggers]
crons = ["0 3 * * *"]

[[ratelimits]]
name = "LICENSE_VALIDATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "AUTH_LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "GATEWAY_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "vectora-email"

[[queues.consumers]]
queue = "vectora-email"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "vectora-email-dlq"

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "vectora-jobs"

[[queues.consumers]]
queue = "vectora-jobs"
max_batch_size = 10
max_retries = 3
max_concurrency = 1
dead_letter_queue = "vectora-jobs-dlq"

[vars]
MAX_PAYLOAD_BYTES = "5242880"
QUEUE_TTL_MS = "600000"
APP_URL = "https://vectora.company"
GATEWAY_URL = "https://gateway.vectora.chat"
