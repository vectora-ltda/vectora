name = "vectora-services"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

# gateway/ — OAuth/webhooks pro app desktop, WebSocket
# bidirecional. Domínio migrado de relay.vectora.chat para
# gateway.vectora.chat SEM alias/período de transição (decisão do produto —
# não havia clientes antigos em produção pra coordenar). {token}.vectora.chat
# continua igual (subdomínio de sessão, independente do nome do serviço).
#
# Uma única rota wildcard de zona cobre tanto `gateway.vectora.chat` quanto
# `{token}.vectora.chat` (qualquer subdomínio de vectora.chat) — declarar
# `gateway.vectora.chat` também como Custom Domain em paralelo conflita na
# API da Cloudflare (hostname já coberto por rota), confirmado ao vivo via
# `wrangler deploy` quando o domínio ainda era relay.vectora.chat.
[[routes]]
pattern = "*.vectora.chat/*"
zone_name = "vectora.chat"

[durable_objects]
bindings = [
  { name = "GATEWAY_SESSION", class_name = "GatewaySession" },
  { name = "OAUTH_RESULT", class_name = "OAuthResult" }
]

# Migrations de Durable Object são um ledger append-only rastreado pelo
# `tag` do lado do Cloudflare: uma tag deployada nunca pode ser removida ou
# editada aqui, mesmo que o conteúdo pareça semanticamente estranho —
# qualquer correção é uma migration nova (v3+), nunca uma edição retroativa.
# Editar/remover uma tag já deployada quebra `wrangler deploy` com "Cannot
# apply ... migration to class ... that is already depended on by existing
# Durable Objects".
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewaySession"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "RelaySession", to = "GatewaySession" }]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["OAuthResult"]

[[kv_namespaces]]
binding = "GATEWAY_METRICS"
id = "f38a1de6901643c89d02a69cd5b529e2"

# updates/ (Fase A) — distribuição de releases (electron-updater + download
# público de primeira instalação). Sem domínio próprio — mesclado na raiz de
# services.vectora.company (src/index.ts).
[[r2_buckets]]
binding = "R2"
bucket_name = "vectora-r2"

[[kv_namespaces]]
binding = "KV"
id = "0bed7e9f6db54ff3bb8d04c015c7a0e2"

# auth/billing/license/gdpr/api-keys/issues/rag-library (Fase B/C) — substitui
# o Postgres do Supabase. Sem RLS: autorização é feita em código, em cada
# handler (CLAUDE.md regra 7). Provisionar com `wrangler d1 create vectora-db`
# e colar o `database_id` gerado abaixo.
[[d1_databases]]
binding = "DB"
database_name = "vectora-db"
database_id = "fe18c73c-4af6-4200-ab5e-657fdfa423e9"
migrations_dir = "migrations"

# GDPR hard-delete (soft-delete → 30 dias → apagado de vez). Roda 1x/dia.
[triggers]
crons = ["0 3 * * *"]

# POST /license/validate é público (qualquer app Vectora chama passando só um
# token) — sem isso não tinha nenhuma defesa contra automação/scanning por IP.
# O espaço do token (256 bits aleatórios) já torna força bruta inviável na
# prática, isso aqui é defesa em profundidade, não a proteção primária.
[[ratelimits]]
name = "LICENSE_VALIDATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# /auth/login e /license/agent-login (email+senha) não tinham NENHUMA defesa
# contra brute force — achado da auditoria de segurança de 2026-08-30.
# Limite mais apertado que o de /license/validate (token de 256 bits já é
# defesa em profundidade suficiente ali); aqui é senha, força bruta é viável
# sem rate limit.
[[ratelimits]]
name = "AUTH_LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# POST /register (gateway) já exige VECTORA_APP_SECRET (embutido no
# binário) — isso é defesa em profundidade contra automação em massa
# batendo o endpoint, não a proteção primária.
[[ratelimits]]
name = "GATEWAY_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

# vectora-email: desacopla o envio de verdade (Resend) do request/response —
# 9 pontos no código faziam `await sendEmail(...)` síncrono antes disso.
[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "vectora-email"

[[queues.consumers]]
queue = "vectora-email"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "vectora-email-dlq"

# vectora-jobs: GDPR hard-delete (1 job por usuário, não tudo numa invocação
# de cron só), telemetria de update (fim do read-modify-write racy em KV) e
# ingestão de telemetria/reindex de RAG library. max_concurrency = 1 é
# proposital: serializa o consumer inteiro, o que elimina a race condition
# da telemetria de update sem precisar de lock nenhum.
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "vectora-jobs"

[[queues.consumers]]
queue = "vectora-jobs"
max_batch_size = 10
max_retries = 3
max_concurrency = 1
dead_letter_queue = "vectora-jobs-dlq"

[vars]
MAX_PAYLOAD_BYTES = "5242880"
QUEUE_TTL_MS = "600000"
APP_URL = "https://vectora.company"
GATEWAY_URL = "https://gateway.vectora.chat"
OAUTH_PUBLIC_URL = "https://services.vectora.company"

# Secrets (não vão neste arquivo — `wrangler secret put <nome>`):
#   VECTORA_APP_SECRET     — gateway: secret fixo por produto (embutido no
#                            binário Nuitka, igual pra toda instalação) que
#                            autentica POST /register. Substitui o antigo
#                            VECTORA_JWT_SECRET (JWT por-instalação que nunca
#                            batia com um secret único no Worker — o "sub"
#                            do JWT sempre foi a constante "relay-system",
#                            então essa granularidade nunca existiu de fato).
#   GATEWAY_INTERNAL_SECRET — gateway: só o Worker conhece, autentica chamadas
#                            internas do gatewayHandler pro GatewaySession
#                            (/_health, /_revoke, /_set-secret) — nunca
#                            distribuído em nenhum binário do produto
#   GATEWAY_HMAC_SECRET    — gateway: assina o token de 6 chars por fingerprint
#   VECTORA_OAUTH_SECRET   — Bearer auth no polling de resultados OAuth
#   GITHUB_OAUTH_CLIENT_ID / GITHUB_OAUTH_CLIENT_SECRET — OAuth App da Vectora LTDA
#   GITLAB_OAUTH_CLIENT_ID / GITLAB_OAUTH_CLIENT_SECRET — OAuth App da Vectora LTDA
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET — OAuth App da Vectora LTDA
#   RESEND_API_KEY         — auth/billing/gdpr/issues: envio de email transacional
#   TURNSTILE_SECRET_KEY   — auth/issues: verificação anti-bot (opcional em dev)
#   STRIPE_SECRET_KEY      — billing: API Stripe (clientes INTL)
#   STRIPE_WEBHOOK_SECRET  — billing: valida assinatura do webhook Stripe
#   STRIPE_PRICE_PRO_USD   — billing: price id do plano Pro em USD
#   ASAAS_API_KEY          — billing: API Asaas (clientes BR)
#   ASAAS_API_URL          — billing: default https://api.asaas.com/v3
#   ASAAS_WEBHOOK_SECRET   — billing: valida o header asaas-access-token
#                            (mesmo valor configurado no painel Asaas em
#                            Integrações > Mecanismos de segurança)
#   GHA_BOT_ENCRYPTION_KEY — gha-bot: chave mestra AES-256-GCM (chave de API
#                            do provider, criptografada em repouso no D1)
#   GITHUB_TOKEN           — registry: discovery de skills/MCP (opcional)
